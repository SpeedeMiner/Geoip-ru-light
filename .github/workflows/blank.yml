name: Build Ultimate GeoIP Russia CLIENT v17 (RIR ASN + BGP Origin Dual-Stack)

on:
  workflow_dispatch:
  schedule:
    # Daily refresh: ASN registration country + current BGP-origin prefixes
    - cron: "45 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: geoip-russia-asn-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      IPVERSE_BGP_ARCHIVE: as-ip-blocks.tar.gz
      RU_ASN_REGISTRY: ripe-ru-asns.json
      RU_PREFIX_INPUT: geoip_RU_prefix_origin_map.txt
      ASN_MANIFEST: geoip_RU_asn_manifest.txt
      ASN_STATS: geoip_RU_asn_stats.txt
      PRIVATE_INPUT: loyalsoldier-private.dat
      OUTPUT_FILE: geoip_RU.dat
      CATEGORY_FILE: geoip_RU_categories.txt
      SOURCE_FILE: geoip_RU_sources.txt
      OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download current ASN/BGP dataset and PRIVATE source
        shell: bash
        run: |
          set -euo pipefail

          download_file() {
            local label="$1"
            local output="$2"
            shift 2
            local tmp="${output}.part"
            local url

            rm -f "$tmp"
            for url in "$@"; do
              echo "::group::${label}"
              echo "Trying: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 300 \
                --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 180 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]]; then
                  mv "$tmp" "$output"
                  echo "Downloaded ${label}: $(wc -c < "$output") bytes"
                  echo "::endgroup::"
                  return 0
                fi
                echo "Empty response from ${url}"
              else
                echo "Download failed from ${url}"
              fi
              rm -f "$tmp"
              echo "Trying fallback source..."
              echo "::endgroup::"
            done

            echo "::error::Unable to download ${label} from all configured URLs"
            return 1
          }

          # Registry truth: ASNs whose country allocation is RU according to the RIR statistics.
          # If RIPEstat is unavailable, fail closed rather than publish a partial country set.
          download_file "RIPESTAT REGISTERED RU ASN LIST" "$RU_ASN_REGISTRY" \
            "https://stat.ripe.net/data/country-resource-list/data.json?resource=ru&sourceapp=geoip-russia-asn"

          # Daily-updated ASN folders containing aggregated IPv4/IPv6 BGP-origin prefixes.
          # The master snapshot is preferred for freshness; the latest release is a fallback.
          download_file "IPVERSE ASN/BGP ARCHIVE" "$IPVERSE_BGP_ARCHIVE" \
            "https://codeload.github.com/ipverse/as-ip-blocks/tar.gz/refs/heads/master" \
            "https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz"

          # Keep the existing PRIVATE category source; it does not participate in RU selection.
          download_file "LOYALSOLDIER PRIVATE" "$PRIVATE_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/private.dat"

          test -s "$RU_ASN_REGISTRY"
          python3 -m json.tool "$RU_ASN_REGISTRY" >/dev/null
          test "$(wc -c < "$IPVERSE_BGP_ARCHIVE")" -gt 5000000
          gzip -t "$IPVERSE_BGP_ARCHIVE"
          test -s "$PRIVATE_INPUT"
          ls -lh "$RU_ASN_REGISTRY" "$IPVERSE_BGP_ARCHIVE" "$PRIVATE_INPUT"

      - name: Extract Russian ASN-origin BGP prefixes
        shell: bash
        run: |
          set -euo pipefail

          cat > extract_ru_asn_prefixes.py <<'PY'
          import collections
          import datetime
          import ipaddress
          import json
          import sys
          import tarfile

          archive_path, registry_path, prefixes_path, manifest_path, stats_path = sys.argv[1:6]

          # RIPEstat Country Resource List is based on RIR statistics and is the
          # authority for which ASNs are registered/assigned to RU.
          try:
              with open(registry_path, encoding="utf-8") as registry_file:
                  registry_payload = json.load(registry_file)
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"Cannot parse RIPEstat RU ASN registry: {exc}")

          registry_data = registry_payload.get("data") or {}
          resources = registry_data.get("resources") or {}
          raw_asns = resources.get("asn") or []
          registered_ru_asns = set()
          for raw_asn in raw_asns:
              value = str(raw_asn).strip().upper()
              if value.startswith("AS"):
                  value = value[2:]
              try:
                  asn = int(value)
              except ValueError:
                  continue
              if asn > 0:
                  registered_ru_asns.add(asn)

          if len(registered_ru_asns) < 25:
              raise SystemExit(
                  f"RIPEstat registry sanity check failed: only {len(registered_ru_asns)} RU ASNs"
              )
          archive_json_files = 0
          malformed_json = 0
          ipverse_country_mismatches = collections.Counter()
          ipverse_metadata_origins = collections.Counter()
          active_ru_asns = {}
          prefix_origins = collections.defaultdict(set)
          raw_v4 = 0
          raw_v6 = 0
          invalid_prefixes = 0

          try:
              archive = tarfile.open(archive_path, mode="r:gz")
          except (tarfile.TarError, OSError) as exc:
              raise SystemExit(f"Invalid ipverse archive: {exc}")

          with archive:
              for member in archive:
                  if not member.isfile() or not member.name.endswith("aggregated.json"):
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      malformed_json += 1
                      continue
                  try:
                      item = json.load(stream)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      malformed_json += 1
                      continue
                  archive_json_files += 1

                  metadata = item.get("metadata") or {}
                  try:
                      asn = int(item.get("asn"))
                  except (TypeError, ValueError):
                      continue
                  if asn not in registered_ru_asns:
                      continue

                  # Country membership comes only from RIPEstat/RIR data. The
                  # countryCode/origin fields from ipverse are retained for audit,
                  # but do not gate inclusion in RU.
                  ipverse_country = str(metadata.get("countryCode", "")).upper() or "UNKNOWN"
                  ipverse_origin = str(metadata.get("origin", "")).lower() or "unknown"
                  ipverse_metadata_origins[ipverse_origin] += 1
                  if ipverse_country != "RU":
                      ipverse_country_mismatches[ipverse_country] += 1

                  handle = str(metadata.get("handle") or "-").replace("\t", " ").replace("\n", " ")
                  description = str(metadata.get("description") or "-").replace("\t", " ").replace("\n", " ")
                  asn_record = active_ru_asns.setdefault(asn, {
                      "handle": handle,
                      "description": description,
                      "ipverse_country": ipverse_country,
                      "ipverse_origin": ipverse_origin,
                      "ipv4": 0,
                      "ipv6": 0,
                  })

                  prefix_data = item.get("prefixes") or {}
                  for family, expected_version in (("ipv4", 4), ("ipv6", 6)):
                      for raw_prefix in prefix_data.get(family, []) or []:
                          try:
                              network = ipaddress.ip_network(str(raw_prefix), strict=False)
                              if network.version != expected_version or network.prefixlen == 0:
                                  invalid_prefixes += 1
                                  continue
                          except ValueError:
                              invalid_prefixes += 1
                              continue
                          prefix_text = str(network)
                          prefix_origins[prefix_text].add(asn)
                          asn_record[family] += 1
                          if family == "ipv4":
                              raw_v4 += 1
                          else:
                              raw_v6 += 1

          # Ignore registered RU ASNs that currently have no usable BGP prefixes.
          active_ru_asns = {
              asn: row for asn, row in active_ru_asns.items()
              if row["ipv4"] + row["ipv6"] > 0
          }

          if archive_json_files < 10000:
              raise SystemExit(
                  f"Archive sanity check failed: only {archive_json_files} aggregated.json files; expected at least 10000"
              )
          if malformed_json:
              raise SystemExit(f"Archive contains {malformed_json} malformed aggregated.json files; refusing partial build")
          if len(active_ru_asns) < 25 or not prefix_origins:
              raise SystemExit(
                  f"Too few RU-registered ASNs with BGP prefixes: ASNs={len(active_ru_asns)}, prefixes={len(prefix_origins)}"
              )

          def network_sort(value):
              net = ipaddress.ip_network(value)
              return (net.version, int(net.network_address), net.prefixlen)

          with open(prefixes_path, "w", encoding="utf-8") as out:
              out.write("# Russian ASN-origin BGP prefixes from ipverse/as-ip-blocks\n")
              out.write("# Included when the Origin ASN is present in the RIPEstat RU registered-ASN list\n")
              for prefix in sorted(prefix_origins, key=network_sort):
                  asns = ",".join(f"AS{x}" for x in sorted(prefix_origins[prefix]))
                  out.write(f"{prefix} # {asns}\n")

          with open(manifest_path, "w", encoding="utf-8") as out:
              out.write("# RU ASN registry membership from RIPEstat Country Resource List; prefixes from ipverse BGP archive\n")
              out.write("ASN\tHANDLE\tDESCRIPTION\tRIPE_REGISTRY_COUNTRY\tIPVERSE_COUNTRY_CODE\tIPVERSE_METADATA_ORIGIN\tIPV4_PREFIXES\tIPV6_PREFIXES\n")
              for asn in sorted(active_ru_asns):
                  row = active_ru_asns[asn]
                  out.write(
                      f"AS{asn}\t{row['handle']}\t{row['description']}\tRU\t{row['ipverse_country']}\t{row['ipverse_origin']}\t{row['ipv4']}\t{row['ipv6']}\n"
                  )

          stats = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"Archive aggregated.json files: {archive_json_files}",
              f"Registered RU ASNs in RIPEstat: {len(registered_ru_asns)}",
              f"Registered RU ASNs with BGP prefixes in ipverse: {len(active_ru_asns)}",
              f"Unique RU-origin prefixes: {len(prefix_origins)}",
              f"Raw IPv4 prefixes across RU ASNs: {raw_v4}",
              f"Raw IPv6 prefixes across RU ASNs: {raw_v6}",
              f"MOAS prefixes with multiple RU origins: {sum(1 for origins in prefix_origins.values() if len(origins) > 1)}",
              f"Invalid/default prefixes skipped: {invalid_prefixes}",
              "ipverse countryCode mismatches (included by RIPEstat registry): " + (", ".join(f"{k}={v}" for k, v in sorted(ipverse_country_mismatches.items())) or "none"),
              "ipverse metadata origin distribution (audit only): " + (", ".join(f"{k}={v}" for k, v in sorted(ipverse_metadata_origins.items())) or "none"),
          ]
          with open(stats_path, "w", encoding="utf-8") as out:
              out.write("\n".join(stats) + "\n")

          print("=== ASN/BGP extraction summary ===")
          print("\n".join(stats))
          print(f"Wrote prefixes: {prefixes_path}")
          print(f"Wrote ASN manifest: {manifest_path}")
          PY

          python3 extract_ru_asn_prefixes.py \
            "$IPVERSE_BGP_ARCHIVE" \
            "$RU_ASN_REGISTRY" \
            "$RU_PREFIX_INPUT" \
            "$ASN_MANIFEST" \
            "$ASN_STATS"

          test -s "$RU_PREFIX_INPUT"
          test -s "$ASN_MANIFEST"
          test -s "$ASN_STATS"

      - name: Create ASN-based GeoIP aggregator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geoip-builder

          cat > geoip-builder/main.go <<'EOF'
          package main

          import (
           "bufio"
           "fmt"
           "net/netip"
           "os"
           "sort"
           "strings"

           router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
           "google.golang.org/protobuf/proto"
          )

          type trieNode struct {
           covered bool
           child [2]*trieNode
          }

          type ipTrie struct {
           v4 *trieNode
           v6 *trieNode
          }

          func newIPTrie() *ipTrie {
           return &ipTrie{v4: &trieNode{}, v6: &trieNode{}}
          }

          func getBit(addr netip.Addr, pos int) int {
           if addr.Is4() {
            b := addr.As4()
            return int((b[pos/8] >> (7 - (pos % 8))) & 1)
           }
           b := addr.As16()
           return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          }

          func setBit(addr netip.Addr, pos int) netip.Addr {
           if addr.Is4() {
            b := addr.As4()
            b[pos/8] |= 1 << (7 - (pos % 8))
            return netip.AddrFrom4(b)
           }
           b := addr.As16()
           b[pos/8] |= 1 << (7 - (pos % 8))
           return netip.AddrFrom16(b)
          }

          func (t *ipTrie) insert(prefix netip.Prefix) {
           prefix = prefix.Masked()
           addr, bits := prefix.Addr(), prefix.Bits()
           curr := t.v6
           if addr.Is4() {
            curr = t.v4
           }
           for i := 0; i < bits; i++ {
            if curr.covered {
             return
            }
            bit := getBit(addr, i)
            if curr.child[bit] == nil {
             curr.child[bit] = &trieNode{}
            }
            curr = curr.child[bit]
           }
           curr.covered = true
           curr.child[0], curr.child[1] = nil, nil
          }

          func compressNode(n *trieNode) bool {
           if n == nil {
            return false
           }
           if n.covered {
            n.child[0], n.child[1] = nil, nil
            return true
           }
           if !compressNode(n.child[0]) {
            n.child[0] = nil
           }
           if !compressNode(n.child[1]) {
            n.child[1] = nil
           }
           if n.child[0] != nil && n.child[0].covered && n.child[1] != nil && n.child[1].covered {
            n.covered = true
            n.child[0], n.child[1] = nil, nil
            return true
           }
           return n.child[0] != nil || n.child[1] != nil
          }

          func (t *ipTrie) compress() {
           if !compressNode(t.v4) {
            t.v4 = &trieNode{}
           }
           if !compressNode(t.v6) {
            t.v6 = &trieNode{}
           }
          }

          func subtractNode(target, mask *trieNode) {
           if target == nil || mask == nil {
            return
           }
           if mask.covered {
            target.covered = false
            target.child[0], target.child[1] = nil, nil
            return
           }
           if target.covered {
            target.covered = false
            target.child[0] = &trieNode{covered: true}
            target.child[1] = &trieNode{covered: true}
           }
           if mask.child[0] != nil && target.child[0] != nil {
            subtractNode(target.child[0], mask.child[0])
           }
           if mask.child[1] != nil && target.child[1] != nil {
            subtractNode(target.child[1], mask.child[1])
           }
          }

          func (t *ipTrie) subtract(mask *ipTrie) {
           subtractNode(t.v4, mask.v4)
           subtractNode(t.v6, mask.v6)
           t.compress()
          }

          func extractPrefixes(n *trieNode, addr netip.Addr, depth, bitLen int, out *[]netip.Prefix) {
           if n == nil {
            return
           }
           if n.covered {
            *out = append(*out, netip.PrefixFrom(addr, depth).Masked())
            return
           }
           if depth >= bitLen {
            return
           }
           if n.child[0] != nil {
            extractPrefixes(n.child[0], addr, depth+1, bitLen, out)
           }
           if n.child[1] != nil {
            extractPrefixes(n.child[1], setBit(addr, depth), depth+1, bitLen, out)
           }
          }

          func (t *ipTrie) toPrefixes() []netip.Prefix {
           var out []netip.Prefix
           extractPrefixes(t.v4, netip.IPv4Unspecified(), 0, 32, &out)
           extractPrefixes(t.v6, netip.IPv6Unspecified(), 0, 128, &out)
           return out
          }

          func loadTextPrefixes(trie *ipTrie, path string) (int, error) {
           file, err := os.Open(path)
           if err != nil {
            return 0, err
           }
           defer file.Close()
           count := 0
           scanner := bufio.NewScanner(file)
           scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
           for scanner.Scan() {
            line := strings.TrimSpace(scanner.Text())
            if line == "" || strings.HasPrefix(line, "#") {
             continue
            }
            if index := strings.IndexByte(line, '#'); index >= 0 {
             line = strings.TrimSpace(line[:index])
            }
            for _, field := range strings.Fields(line) {
             prefix, parseErr := netip.ParsePrefix(field)
             if parseErr != nil {
              if addr, addrErr := netip.ParseAddr(field); addrErr == nil {
               prefix = netip.PrefixFrom(addr, addr.BitLen())
              } else {
               continue
              }
             }
             if prefix.Bits() == 0 {
              continue
             }
             trie.insert(prefix)
             count++
             break
            }
           }
           if err := scanner.Err(); err != nil {
            return count, err
           }
           return count, nil
          }

          func insertBuiltInPrivate(t *ipTrie) {
           privateCIDRs := []string{
            "0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8",
            "169.254.0.0/16", "172.16.0.0/12", "192.0.0.0/24", "192.0.2.0/24",
            "192.88.99.0/24", "192.168.0.0/16", "198.18.0.0/15", "198.51.100.0/24",
            "203.0.113.0/24", "224.0.0.0/4", "240.0.0.0/4",
            "::/128", "::1/128", "::ffff:0:0/96", "64:ff9b::/96", "100::/64",
            "2001::/23", "2001:db8::/32", "fc00::/7", "fe80::/10", "ff00::/8",
           }
           for _, value := range privateCIDRs {
            if prefix, err := netip.ParsePrefix(value); err == nil {
             t.insert(prefix)
            }
           }
          }

          func loadPrivateDat(path string, trie *ipTrie) (int, error) {
           data, err := os.ReadFile(path)
           if err != nil {
            return 0, err
           }
           list := new(router.GeoIPList)
           if err := proto.Unmarshal(data, list); err != nil {
            return 0, fmt.Errorf("invalid PRIVATE GeoIP %s: %w", path, err)
           }
           added := 0
           for _, entry := range list.Entry {
            if entry == nil || !strings.EqualFold(strings.TrimSpace(entry.CountryCode), "private") {
             continue
            }
            for _, cidr := range entry.Cidr {
             if cidr == nil || cidr.Prefix > 128 {
              continue
             }
             var addr netip.Addr
             switch len(cidr.Ip) {
             case 4:
              var bytes [4]byte
              copy(bytes[:], cidr.Ip)
              addr = netip.AddrFrom4(bytes)
             case 16:
              var bytes [16]byte
              copy(bytes[:], cidr.Ip)
              addr = netip.AddrFrom16(bytes)
             default:
              continue
             }
             if int(cidr.Prefix) > addr.BitLen() {
              continue
             }
             trie.insert(netip.PrefixFrom(addr, int(cidr.Prefix)).Masked())
             added++
            }
           }
           if added == 0 {
            return 0, fmt.Errorf("no PRIVATE CIDRs found in %s", path)
           }
           return added, nil
          }

          func sortPrefixes(prefixes []netip.Prefix) {
           sort.Slice(prefixes, func(i, j int) bool {
            if prefixes[i].Addr().BitLen() != prefixes[j].Addr().BitLen() {
             return prefixes[i].Addr().BitLen() < prefixes[j].Addr().BitLen()
            }
            if cmp := prefixes[i].Addr().Compare(prefixes[j].Addr()); cmp != 0 {
             return cmp < 0
            }
            return prefixes[i].Bits() < prefixes[j].Bits()
           })
          }

          func writeOutput(priv, ru []netip.Prefix, path string) ([]byte, error) {
           result := new(router.GeoIPList)
           targets := []struct {
            name string
            prefixes []netip.Prefix
           }{{"PRIVATE", priv}, {"RU", ru}}
           for _, target := range targets {
            if len(target.prefixes) == 0 {
             continue
            }
            entry := &router.GeoIP{CountryCode: target.name}
            for _, prefix := range target.prefixes {
             if prefix.Addr().Is4() {
              a := prefix.Addr().As4()
              entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: []byte{a[0], a[1], a[2], a[3]}, Prefix: uint32(prefix.Bits())})
             } else {
              a := prefix.Addr().As16()
              ip := make([]byte, 16)
              copy(ip, a[:])
              entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: ip, Prefix: uint32(prefix.Bits())})
             }
            }
            result.Entry = append(result.Entry, entry)
           }
           data, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
           if err != nil {
            return nil, err
           }
           return data, os.WriteFile(path, data, 0644)
          }

          func writeCategories(path string, privateCount, ruCount int) error {
           content := fmt.Sprintf("RU\t%d\nPRIVATE\t%d\n", ruCount, privateCount)
           return os.WriteFile(path, []byte(content), 0644)
          }

          func writeSources(path string, rawRU, asnCount, privateSourceCount, ruCount, privateCount int) error {
           content := fmt.Sprintf(`GeoIP Russia CLIENT v17 (RIR ASN + BGP Origin, Dual-Stack)
          - RU includes BGP-origin prefixes announced by ASNs registered to RU in RIPEstat Country Resource List.
          - RIPEstat Country Resource List is based on Regional Internet Registry statistics; it determines ASN country membership.
          - Prefix data: ipverse/as-ip-blocks daily bulk dataset; it supplies the BGP prefixes for each ASN.
          - No IP geolocation filter is applied: a Russian-registered ASN remains RU regardless of the physical location of its server.
          - MOAS prefix is included when at least one RIPEstat-registered RU ASN originates it.
          - ipverse countryCode/metadata origin are recorded for auditing only and do not override RIPEstat registry membership.
          - PRIVATE: built-in special/private ranges plus Loyalsoldier geoip private.dat.
          - Legacy direct/whitelist/GeoIP country lists are not used to populate RU.
          - Antifilter / Re-filter deny lists are not subtracted.

          Build counters:
          RU-registered ASNs with BGP data: %d
          Unique RU-origin prefix input lines: %d
          Output RU CIDRs: %d
          PRIVATE source CIDRs: %d
          Output PRIVATE CIDRs: %d
          `, asnCount, rawRU, ruCount, privateSourceCount, privateCount)
           return os.WriteFile(path, []byte(content), 0644)
          }

          func main() {
           if len(os.Args) != 6 {
            fmt.Fprintf(os.Stderr, "usage: %s <ru-prefixes.txt> <private.dat> <output.dat> <categories.txt> <sources.txt>\n", os.Args[0])
            os.Exit(2)
           }
           prefixPath, privatePath := os.Args[1], os.Args[2]
           outputPath, categoryPath, sourcePath := os.Args[3], os.Args[4], os.Args[5]

           ruTrie := newIPTrie()
           privateTrie := newIPTrie()
           rawRUCount, err := loadTextPrefixes(ruTrie, prefixPath)
           if err != nil {
            panic(fmt.Errorf("load RU ASN-origin prefixes: %w", err))
           }
           if rawRUCount == 0 {
            panic("no RU ASN-origin prefixes were loaded; refusing to publish")
           }
           insertBuiltInPrivate(privateTrie)
           privateSourceCount, err := loadPrivateDat(privatePath, privateTrie)
           if err != nil {
            panic(err)
           }

           ruTrie.compress()
           beforeSubtract := len(ruTrie.toPrefixes())
           ruTrie.subtract(privateTrie)
           ruTrie.compress()
           privateTrie.compress()

           ruPrefixes := ruTrie.toPrefixes()
           privatePrefixes := privateTrie.toPrefixes()
           sortPrefixes(ruPrefixes)
           sortPrefixes(privatePrefixes)
           if len(ruPrefixes) == 0 {
            panic("final RU category is empty; refusing to publish")
           }

           data, err := writeOutput(privatePrefixes, ruPrefixes, outputPath)
           if err != nil {
            panic(fmt.Errorf("write GeoIP protobuf: %w", err))
           }
           if err := writeCategories(categoryPath, len(privatePrefixes), len(ruPrefixes)); err != nil {
            panic(err)
           }

           // Extract the active RU ASN count from the companion manifest header/body.
           asnCount := 0
           if file, openErr := os.Open("geoip_RU_asn_manifest.txt"); openErr == nil {
            scanner := bufio.NewScanner(file)
            for scanner.Scan() {
             line := scanner.Text()
             if len(line) > 2 && strings.HasPrefix(line, "AS") && line[2] >= '0' && line[2] <= '9' {
              asnCount++
             }
            }
            file.Close()
           }
           if err := writeSources(sourcePath, rawRUCount, asnCount, privateSourceCount, len(ruPrefixes), len(privatePrefixes)); err != nil {
            panic(err)
           }

           fmt.Println("=============================================")
           fmt.Println("ULTIMATE GEOIP RUSSIA CLIENT v17 (RIR ASN + BGP ORIGIN)")
           fmt.Println("=============================================")
           fmt.Printf("RU-registered ASNs with BGP data: %d\n", asnCount)
           fmt.Printf("Unique RU ASN-origin prefix lines: %d\n", rawRUCount)
           fmt.Printf("RU CIDRs before PRIVATE prune  : %d\n", beforeSubtract)
           fmt.Printf("Output geoip:RU                : %d CIDRs\n", len(ruPrefixes))
           fmt.Printf("PRIVATE source CIDRs           : %d\n", privateSourceCount)
           fmt.Printf("Output geoip:PRIVATE           : %d CIDRs\n", len(privatePrefixes))
           fmt.Printf("Final file size                : %d bytes\n", len(data))
          }
          EOF

          gofmt -w geoip-builder/main.go
          cd geoip-builder
          GOFLAGS=-mod=mod go mod init geoip-builder
          GOFLAGS=-mod=mod go get github.com/v2fly/v2ray-core/v5/app/router/routercommon@latest
          GOFLAGS=-mod=mod go get google.golang.org/protobuf@latest
          GOFLAGS=-mod=mod go build -o /tmp/geoip-asn-builder .
          cd ..

          /tmp/geoip-asn-builder \
            "$RU_PREFIX_INPUT" \
            "$PRIVATE_INPUT" \
            "$OUTPUT_FILE" \
            "$CATEGORY_FILE" \
            "$SOURCE_FILE"

          test -s "$OUTPUT_FILE"
          test -s "$CATEGORY_FILE"
          test -s "$SOURCE_FILE"

      - name: Validate ASN-based GeoIP output
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUTPUT_FILE" "$ASN_MANIFEST" "$ASN_STATS" <<'PY'
          import os, sys
          output, manifest, stats = sys.argv[1:]
          if not os.path.isfile(output) or os.path.getsize(output) < 4:
              raise SystemExit("GeoIP protobuf output is empty or too small")
          if not os.path.isfile(manifest) or os.path.getsize(manifest) < 100:
              raise SystemExit("ASN manifest is missing or unexpectedly small")
          if not os.path.isfile(stats) or os.path.getsize(stats) < 100:
              raise SystemExit("ASN extraction statistics are missing")
          print(f"Validated protobuf payload: {os.path.getsize(output)} bytes")
          PY

          echo "=== ASN/BGP extraction statistics ==="
          cat "$ASN_STATS"
          echo "=== ASN manifest preview ==="
          head -n 15 "$ASN_MANIFEST"
          echo "=== Prefix-to-Origin-ASN map preview ==="
          head -n 15 "$RU_PREFIX_INPUT"
          echo "=== GeoIP categories ==="
          cat "$CATEGORY_FILE"
          echo "=== GeoIP source manifest ==="
          cat "$SOURCE_FILE"
          echo "=== SHA256 ==="
          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-geoip-client-v17
          name: "Ultimate GeoIP Russia CLIENT v17 (RIR ASN + BGP Origin)"
          make_latest: false
          files: |
            geoip_RU.dat
            geoip_RU.dat.sha256sum
            geoip_RU_categories.txt
            geoip_RU_sources.txt
            geoip_RU_asn_manifest.txt
            geoip_RU_asn_stats.txt
            geoip_RU_prefix_origin_map.txt
          body: |
            # Ultimate GeoIP Russia CLIENT v17 — RIR ASN + BGP Origin

            ## Existing output categories only
            - `geoip:RU` — prefixes announced by ASNs whose RIR registration country is `RU`.
            - `geoip:PRIVATE` — private, reserved, loopback, CGNAT, link-local and service ranges.

            ## Selection rules
            - Uses RIPEstat Country Resource List for registered RU ASNs and daily `ipverse/as-ip-blocks` for their BGP-origin prefixes.
            - ipverse countryCode and metadata origin are audit fields only; RIPEstat determines registered country membership.
            - No IP geolocation gate: Russian-registered ASN prefixes stay in RU regardless of physical server location.
            - A MOAS prefix is included when at least one RU-registered ASN originates it.
            - Legacy whitelist/direct lists and GeoIP country databases do not populate RU.
            - IPv4 and IPv6 are included.

      - name: Publish release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geoip-client-release
          mkdir -p /tmp/geoip-client-release
          cp "$OUTPUT_FILE" /tmp/geoip-client-release/geoip_RU.dat
          cp "$OUTPUT_SHA_FILE" /tmp/geoip-client-release/geoip_RU.dat.sha256sum
          cp "$CATEGORY_FILE" /tmp/geoip-client-release/geoip_RU_categories.txt
          cp "$SOURCE_FILE" /tmp/geoip-client-release/geoip_RU_sources.txt
          cp "$ASN_MANIFEST" /tmp/geoip-client-release/geoip_RU_asn_manifest.txt
          cp "$ASN_STATS" /tmp/geoip-client-release/geoip_RU_asn_stats.txt
          cp "$RU_PREFIX_INPUT" /tmp/geoip-client-release/geoip_RU_prefix_origin_map.txt
          cd /tmp/geoip-client-release
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update ASN-origin GeoIP Russia"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push --force origin release
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat" >/dev/null 2>&1 || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat.sha256sum" >/dev/null 2>&1 || true

      - name: Print download URLs
        shell: bash
        run: |
          echo "GitHub Release: https://github.com/${{ github.repository }}/releases/download/latest-geoip-client-v17/geoip_RU.dat"
          echo "Raw release branch: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU.dat"
          echo "jsDelivr: https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat"
          echo "ASN manifest: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_asn_manifest.txt"
