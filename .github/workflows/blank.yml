name: Build Ultimate GeoIP Russia CLIENT v27 (Monotonic v24 Baseline + Protected Loyalsoldier/v2fly RU + Additive ASN/BGP)

on:
  workflow_dispatch:
  schedule:
    # Daily refresh; existing RU sources remain the base, ASN/BGP only supplements.
    - cron: "45 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: geoip-russia-additive-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      HYDRA_INPUT: hydra-geoip.dat
      GRIMBIRD_INPUT: grimbird-geoip.dat
      DIGNE_INPUT: digne-geoip.dat
      DAVOYAN_INPUT: davoyan-geoip.dat
      KIRILL_INPUT: kirill-geoip.dat
      GOLUKON_INPUT: golukon-geoip.dat
      V2FLY_INPUT: v2fly-geoip.dat
      V2FLY_SHA_INPUT: v2fly-geoip.dat.sha256sum
      V24_BASELINE_INPUT: geoip_RU_v24_baseline.dat
      V24_BASELINE_SHA_INPUT: geoip_RU_v24_baseline.dat.sha256sum
      LOYALSOLDIER_RU_INPUT: loyalsoldier-ru.dat
      LOYALSOLDIER_PRIVATE_INPUT: loyalsoldier-private.dat
      HXEHEX_INPUT: hxehex-cidrwhitelist.txt
      W1ZARDZ_INPUT: w1zardz-ru-ipv4.txt
      RU_ASN_REGISTRY: geoip_RU_registered_asns.txt
      AFRINIC_STATS: delegated-afrinic-latest
      APNIC_STATS: delegated-apnic-latest
      ARIN_STATS: delegated-arin-extended-latest
      LACNIC_STATS: delegated-lacnic-latest
      RIPENCC_STATS: delegated-ripencc-latest
      IPVERSE_BGP_ARCHIVE: as-ip-blocks.tar.gz
      RU_PREFIX_INPUT: geoip_RU_asn_bgp_prefixes.txt
      ASN_MANIFEST: geoip_RU_asn_manifest.txt
      ASN_STATS: geoip_RU_asn_stats.txt
      SOURCE_COUNTS: geoip_RU_source_counts.txt
      OUTPUT_FILE: geoip_RU.dat
      CATEGORY_FILE: geoip_RU_categories.txt
      SOURCE_FILE: geoip_RU_sources.txt
      OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Download RU sources, v2fly and v24 regression baseline plus ASN/BGP supplement
        shell: bash
        run: |
          set -euo pipefail

          download_file() {
            local label="$1"
            local output="$2"
            shift 2
            local tmp="${output}.part"
            local url
            rm -f "$tmp"

            for url in "$@"; do
              echo "::group::${label}"
              echo "Trying: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 180 \
                --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]]; then
                  mv "$tmp" "$output"
                  echo "Downloaded ${label}: $(wc -c < "$output") bytes"
                  echo "::endgroup::"
                  return 0
                fi
                echo "Empty response from ${url}"
              else
                echo "Download failed from ${url}"
              fi
              rm -f "$tmp"
              echo "Trying next mirror..."
              echo "::endgroup::"
            done

            echo "::error::Unable to download required source: ${label}"
            return 1
          }

          # Kirill publishes geoip.dat as a GitHub Release asset, not as a file
          # under the main branch. Resolve the latest asset through the official
          # GitHub REST API first; this avoids relying on the browser_download_url
          # host alone when github.com/release-assets returns transient HTTP 5xx.
          download_kirill_geoip() {
            local label="KIRILL RU WHITELIST"
            local output="$KIRILL_INPUT"
            local repo="kirilllavrov/RU-domain-list-for-whitelist"
            local metadata="${output}.release.json"
            local tmp="${output}.part"
            local api_url asset_id="" tag_name="" asset_digest="" asset_info=""
            local expected_sha="" actual_sha="" url
            rm -f "$metadata" "$tmp"

            for api_url in \
              "https://api.github.com/repos/${repo}/releases/latest" \
              "https://api.github.com/repos/${repo}/releases/tags/0.3.11"; do
              echo "Resolving ${label} asset through: ${api_url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 90 \
                --retry 2 --retry-all-errors --retry-delay 2 \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "User-Agent: geoip-russia-builder" \
                --output "$metadata" "$api_url"; then
                asset_info="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); a=next((x for x in d.get("assets", []) if x.get("name") == "geoip.dat"), {}); print("\t".join((str(a.get("id", "")), str(d.get("tag_name", "")), str(a.get("digest", "") or ""))))' "$metadata" 2>/dev/null || true)"
                IFS=$'\t' read -r asset_id tag_name asset_digest <<< "$asset_info"
                if [[ "$asset_id" =~ ^[0-9]+$ ]]; then
                  echo "Found geoip.dat release asset: tag=${tag_name:-unknown}, asset_id=${asset_id}"
                  if curl --fail --location --silent --show-error \
                    --connect-timeout 20 --max-time 240 \
                    --retry 3 --retry-all-errors --retry-delay 3 \
                    --header "Accept: application/octet-stream" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --header "User-Agent: geoip-russia-builder" \
                    --output "$tmp" \
                    "https://api.github.com/repos/${repo}/releases/assets/${asset_id}"; then
                    if [[ -s "$tmp" ]] && [[ "$(wc -c < "$tmp")" -gt 32 ]] && \
                      python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                      if [[ "$asset_digest" == sha256:* ]]; then
                        expected_sha="${asset_digest#sha256:}"
                        actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                        if [[ "$actual_sha" != "$expected_sha" ]]; then
                          echo "SHA256 mismatch for ${label}: expected=${expected_sha}, actual=${actual_sha}"
                          rm -f "$tmp"
                          continue
                        fi
                      fi
                      mv "$tmp" "$output"
                      rm -f "$metadata"
                      echo "Downloaded and validated ${label} through GitHub Release API: $(wc -c < "$output") bytes"
                      return 0
                    fi
                    echo "GitHub API response is not a valid-looking Xray GeoIP protobuf asset"
                  else
                    echo "GitHub Release API asset download failed for asset_id=${asset_id}"
                  fi
                else
                  echo "Release metadata does not contain geoip.dat"
                fi
              else
                echo "Could not retrieve release metadata from ${api_url}"
              fi
              rm -f "$tmp" "$metadata"
            done

            echo "GitHub API route unavailable; trying official Release URL and independent mirrors"
            for url in \
              "https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.org/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.com/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghproxy.net/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghfast.top/https://github.com/${repo}/releases/latest/download/geoip.dat"; do
              rm -f "$tmp"
              echo "Trying ${label} mirror: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 240 \
                --retry 2 --retry-all-errors --retry-delay 3 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]] && \
                  python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                  if [[ "$asset_digest" == sha256:* ]]; then
                    expected_sha="${asset_digest#sha256:}"
                    actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                    if [[ "$actual_sha" != "$expected_sha" ]]; then
                      echo "SHA256 mismatch for ${label} mirror ${url}"
                      rm -f "$tmp"
                      continue
                    fi
                  fi
                  mv "$tmp" "$output"
                  echo "Downloaded and validated ${label} from mirror: $(wc -c < "$output") bytes"
                  rm -f "$metadata"
                  return 0
                fi
                echo "Mirror returned an invalid or empty GeoIP protobuf: ${url}"
              else
                echo "Mirror download failed: ${url}"
              fi
            done

            rm -f "$tmp" "$metadata" "$output"
            echo "::error::Unable to download a valid ${label} asset from GitHub API or mirrors"
            return 1
          }

          echo "==============================================="
          echo "Downloading original RU sources (kept intact)"
          echo "==============================================="

          download_file "HYDRA" "$HYDRA_INPUT" \
            "https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip@master/release/geoip.dat"

          download_file "GRIMBIRD" "$GRIMBIRD_INPUT" \
            "https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/GrimbirdUsers/ru-routing-dat@main/geoip.dat"

          download_file "DIGNE" "$DIGNE_INPUT" \
            "https://cdn.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geoip.dat"

          download_file "DAVOYAN" "$DAVOYAN_INPUT" \
            "https://raw.githubusercontent.com/Davoyan/xray-routing/main/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/Davoyan/xray-routing@main/release/geoip.dat"

          # Kirill is part of the existing RU whitelist base. Fetch its actual
          # Release asset via the GitHub API and independent Release mirrors.
          # Do not substitute a nonexistent main/release/geoip.dat path.
          download_kirill_geoip

          download_file "GOLUKON" "$GOLUKON_INPUT" \
            "https://raw.githubusercontent.com/golukon/russia-only-geoip/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat"

          # v2fly publishes the full V2Ray GeoIP protobuf database and a SHA-256
          # sidecar. Verify the exact upstream bytes before importing only the RU entry.
          download_file "V2FLY GEOIP SHA256" "$V2FLY_SHA_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat.sha256sum" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat.sha256sum"
          download_file "V2FLY GEOIP (RU CATEGORY ONLY)" "$V2FLY_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat"
          V2FLY_EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$V2FLY_SHA_INPUT" | tr -d '\r')"
          if [[ ! "$V2FLY_EXPECTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid v2fly geoip.dat.sha256sum format"
            exit 1
          fi
          V2FLY_ACTUAL_SHA="$(sha256sum "$V2FLY_INPUT" | awk '{print $1}')"
          if [[ "$V2FLY_ACTUAL_SHA" != "$V2FLY_EXPECTED_SHA" ]]; then
            echo "::error::v2fly geoip.dat SHA-256 mismatch: expected=$V2FLY_EXPECTED_SHA actual=$V2FLY_ACTUAL_SHA"
            exit 1
          fi
          echo "v2fly geoip.dat SHA-256 verified: $V2FLY_ACTUAL_SHA"

          # Mandatory regression floor: fetch the exact v24 published binary and checksum.
          V24_RELEASE_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-geoip-client-v24"
          download_file "V24 RU BASELINE SHA256" "$V24_BASELINE_SHA_INPUT" \
            "${V24_RELEASE_BASE}/geoip_RU.dat.sha256sum"
          download_file "V24 RU BASELINE" "$V24_BASELINE_INPUT" \
            "${V24_RELEASE_BASE}/geoip_RU.dat"
          V24_EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$V24_BASELINE_SHA_INPUT" | tr -d '\r')"
          if [[ ! "$V24_EXPECTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid v24 geoip_RU.dat.sha256sum format"
            exit 1
          fi
          V24_ACTUAL_SHA="$(sha256sum "$V24_BASELINE_INPUT" | awk '{print $1}')"
          if [[ "$V24_ACTUAL_SHA" != "$V24_EXPECTED_SHA" ]]; then
            echo "::error::v24 baseline SHA-256 mismatch: expected=$V24_EXPECTED_SHA actual=$V24_ACTUAL_SHA"
            exit 1
          fi
          echo "v24 RU baseline SHA-256 verified: $V24_ACTUAL_SHA"

          download_file "LOYALSOLDIER RU (CORE SOURCE, NOT A MASK)" "$LOYALSOLDIER_RU_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/ru.dat"

          download_file "LOYALSOLDIER PRIVATE" "$LOYALSOLDIER_PRIVATE_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/private.dat"

          download_file "HXEHEX MOBILE WHITELIST" "$HXEHEX_INPUT" \
            "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt" \
            "https://cdn.jsdelivr.net/gh/hxehex/russia-mobile-internet-whitelist@main/cidrwhitelist.txt"

          download_file "W1ZARDZ RU DIRECT IPV4" "$W1ZARDZ_INPUT" \
            "https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-ipv4.txt" \
            "https://cdn.jsdelivr.net/gh/w1zardz/amnezia-vpn-russia-split-tunneling@master/dist/ru-direct-ipv4.txt"

          echo "==============================================="
          echo "Downloading additive RU ASN/BGP data"
          echo "==============================================="

          # RIPEstat's Country Resource List is itself derived from RIR delegated
          # statistics. Avoid making the RIPEstat API a single point of failure:
          # fetch each RIR's authoritative daily file, with cross-RIR mirrors.
          echo "==============================================="
          echo "Downloading five RIR delegated statistics files"
          echo "==============================================="

          download_file "AFRINIC DELEGATED STATS" "$AFRINIC_STATS" \
            "https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.apnic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.ripe.net/pub/stats/afrinic/delegated-afrinic-latest"

          download_file "APNIC DELEGATED STATS" "$APNIC_STATS" \
            "https://ftp.apnic.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.ripe.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.afrinic.net/pub/stats/apnic/delegated-apnic-latest"

          download_file "ARIN DELEGATED STATS" "$ARIN_STATS" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-latest" \
            "https://ftp.ripe.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.apnic.net/pub/stats/arin/delegated-arin-extended-latest"

          download_file "LACNIC DELEGATED STATS" "$LACNIC_STATS" \
            "https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.ripe.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.apnic.net/pub/stats/lacnic/delegated-lacnic-latest"

          download_file "RIPE NCC DELEGATED STATS" "$RIPENCC_STATS" \
            "https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.apnic.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.afrinic.net/pub/stats/ripencc/delegated-ripencc-latest"

          # Build the RU ASN registry from the five RIR files.
          # RIR format: registry|cc|type|start|value|date|status[|extensions...]
          python3 - "$AFRINIC_STATS" "$APNIC_STATS" "$ARIN_STATS" \
            "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" <<'PY'
          import datetime
          import pathlib
          import sys

          inputs = [
              ("afrinic", pathlib.Path(sys.argv[1])),
              ("apnic", pathlib.Path(sys.argv[2])),
              ("arin", pathlib.Path(sys.argv[3])),
              ("lacnic", pathlib.Path(sys.argv[4])),
              ("ripencc", pathlib.Path(sys.argv[5])),
          ]
          output = pathlib.Path(sys.argv[6])
          asns = set()
          summaries = []
          today = datetime.date.today()

          for expected_registry, path in inputs:
              try:
                  lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              except (OSError, UnicodeError) as exc:
                  raise SystemExit(f"Cannot read {expected_registry} delegated stats: {exc}")
              if not lines:
                  raise SystemExit(f"Empty delegated stats file: {path}")

              header = None
              for line in lines:
                  # The standard currently appears as version 2 or 2.3 depending
                  # on the RIR and whether the extended opaque-id format is used.
                  # Strip a possible UTF-8 BOM and whitespace from every field.
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  version = fields[0] if fields else ""
                  is_supported_version = version == "2" or version.startswith("2.")
                  if (
                      len(fields) >= 7
                      and is_supported_version
                      and fields[1].lower() == expected_registry
                  ):
                      header = fields
                      break
              if header is None:
                  first_nonempty = next((line.strip() for line in lines if line.strip()), "<empty>")
                  raise SystemExit(
                      f"Invalid/mismatched {expected_registry} stats header in {path}; "
                      f"first non-empty line: {first_nonempty[:160]!r}. "
                      "Expected version 2 or 2.x and matching registry name."
                  )

              # Header format: version|registry|serial|records|startdate|enddate|UTCoffset.
              # The enddate is field 5; the serial (field 2) is not necessarily a date.
              try:
                  snapshot_date = datetime.datetime.strptime(header[5], "%Y%m%d").date()
              except ValueError:
                  raise SystemExit(
                      f"Invalid snapshot enddate in {expected_registry}: {header[5]!r} "
                      f"(header version {header[0]!r})"
                  )
              age_days = (today - snapshot_date).days
              if age_days < -1 or age_days > 14:
                  raise SystemExit(
                      f"Stale/future {expected_registry} delegated stats: {snapshot_date} ({age_days} days old)"
                  )

              ru_asn_records = 0
              for line in lines:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  fields = line.split("|")
                  if len(fields) < 7:
                      continue
                  registry, country, resource_type, start, value, _date, status = fields[:7]
                  if registry.lower() != expected_registry or country.upper() != "RU" or resource_type.lower() != "asn":
                      continue
                  if status.lower() not in {"allocated", "assigned", "legacy"}:
                      continue
                  try:
                      first = int(start)
                      count = int(value)
                  except ValueError:
                      continue
                  if first < 1 or count < 1 or first + count - 1 > 4294967295:
                      continue
                  ru_asn_records += 1
                  asns.update(range(first, first + count))

              note = " (zero is valid for an RIR with no RU-registered ASN allocations)" if ru_asn_records == 0 else ""
              summaries.append(
                  f"{expected_registry}: snapshot={snapshot_date}, RU ASN records={ru_asn_records}{note}"
              )
              print(summaries[-1])

          if len(asns) < 25 or len(asns) > 100000:
              raise SystemExit(f"RIR ASN registry sanity check failed: {len(asns)} unique RU ASNs")

          with output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique RU ASNs from allocated, assigned and legacy records in the five RIR delegated stats files\n")
              handle.write("# One ASN per line; source format: registry|cc|type|start|value|date|status\n")
              for asn in sorted(asns):
                  handle.write(f"AS{asn}\n")
          print(f"Unique RU-registered ASNs: {len(asns)}")
          print("RIR source summary: " + "; ".join(summaries))
          PY

          download_file "IPVERSE ASN/BGP ARCHIVE" "$IPVERSE_BGP_ARCHIVE" \
            "https://codeload.github.com/ipverse/as-ip-blocks/tar.gz/refs/heads/master" \
            "https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz"

          # Validate every required core source and the additive ASN/BGP inputs before parsing.
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" \
                      "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                      "$V24_BASELINE_INPUT" "$V24_BASELINE_SHA_INPUT" \
                      "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                      "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                      "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
                      "$IPVERSE_BGP_ARCHIVE"; do
            test -s "$file" || { echo "::error::Missing or empty required input: $file"; exit 1; }
          done
          test "$(wc -c < "$IPVERSE_BGP_ARCHIVE")" -gt 5000000
          gzip -t "$IPVERSE_BGP_ARCHIVE"
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V24_BASELINE_INPUT" "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT"; do
            test "$(wc -c < "$file")" -gt 100 || { echo "::error::Unexpectedly small GeoIP source: $file"; exit 1; }
          done
          ls -lh "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" \
                 "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                 "$V24_BASELINE_INPUT" "$V24_BASELINE_SHA_INPUT" \
                 "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                 "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                 "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" "$IPVERSE_BGP_ARCHIVE"

      - name: Extract current BGP prefixes for RIR-registered RU ASNs
        shell: bash
        run: |
          set -euo pipefail

          cat > extract_ru_asn_prefixes.py <<'PY'
          import collections
          import datetime
          import ipaddress
          import json
          import sys
          import tarfile

          archive_path, registry_path, prefixes_path, manifest_path, stats_path = sys.argv[1:6]
          registered_ru_asns = set()
          try:
              with open(registry_path, encoding="utf-8") as source:
                  for raw in source:
                      value = raw.strip().upper()
                      if not value or value.startswith("#"):
                          continue
                      value = value.removeprefix("AS")
                      try:
                          asn = int(value)
                      except ValueError:
                          continue
                      if 0 < asn <= 4294967295:
                          registered_ru_asns.add(asn)
          except OSError as exc:
              raise SystemExit(f"Cannot read registered RU ASN list: {exc}")

          if len(registered_ru_asns) < 25:
              raise SystemExit(f"RIR delegated-stats sanity check failed: only {len(registered_ru_asns)} RU ASNs")

          archive_json_files = 0
          malformed_json = 0
          metadata_country_mismatch = collections.Counter()
          prefix_origins = collections.defaultdict(set)
          active_ru_asns = {}
          raw_v4 = raw_v6 = invalid_prefixes = 0

          try:
              archive = tarfile.open(archive_path, mode="r:gz")
          except (tarfile.TarError, OSError) as exc:
              raise SystemExit(f"Invalid ipverse archive: {exc}")

          with archive:
              for member in archive:
                  if not member.isfile() or not member.name.endswith("aggregated.json"):
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      malformed_json += 1
                      continue
                  try:
                      item = json.load(stream)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      malformed_json += 1
                      continue
                  archive_json_files += 1

                  try:
                      asn = int(item.get("asn"))
                  except (TypeError, ValueError):
                      continue
                  if asn not in registered_ru_asns:
                      continue

                  metadata = item.get("metadata") or {}
                  country_code = str(metadata.get("countryCode") or "UNKNOWN").upper()
                  if country_code != "RU":
                      metadata_country_mismatch[country_code] += 1

                  row = active_ru_asns.setdefault(asn, {
                      "handle": str(metadata.get("handle") or "-").replace("\t", " ").replace("\n", " "),
                      "description": str(metadata.get("description") or "-").replace("\t", " ").replace("\n", " "),
                      "ipverse_country": country_code,
                      "ipv4": 0,
                      "ipv6": 0,
                  })

                  prefixes = item.get("prefixes") or {}
                  for family, version in (("ipv4", 4), ("ipv6", 6)):
                      for raw_prefix in prefixes.get(family, []) or []:
                          try:
                              network = ipaddress.ip_network(str(raw_prefix), strict=False)
                              if network.version != version or network.prefixlen == 0:
                                  invalid_prefixes += 1
                                  continue
                          except ValueError:
                              invalid_prefixes += 1
                              continue
                          prefix_origins[str(network)].add(asn)
                          row[family] += 1
                          if family == "ipv4":
                              raw_v4 += 1
                          else:
                              raw_v6 += 1

          active_ru_asns = {asn: row for asn, row in active_ru_asns.items() if row["ipv4"] + row["ipv6"] > 0}
          if archive_json_files < 10000:
              raise SystemExit(f"ipverse sanity check failed: only {archive_json_files} aggregated.json files")
          if malformed_json:
              raise SystemExit(f"ipverse archive contains {malformed_json} malformed JSON files; refusing partial data")
          if len(active_ru_asns) < 25 or not prefix_origins:
              raise SystemExit(f"Too few RU ASNs with active BGP data: ASNs={len(active_ru_asns)}, prefixes={len(prefix_origins)}")

          def sort_key(value):
              network = ipaddress.ip_network(value)
              return network.version, int(network.network_address), network.prefixlen

          with open(prefixes_path, "w", encoding="utf-8") as output:
              output.write("# Additive BGP supplement: prefixes currently announced by RU ASNs registered in the five RIR delegated statistics files\n")
              output.write("# This file supplements the legacy RU sources; it does not replace or filter them.\n")
              for prefix in sorted(prefix_origins, key=sort_key):
                  origins = ",".join(f"AS{asn}" for asn in sorted(prefix_origins[prefix]))
                  output.write(f"{prefix} # {origins}\n")

          with open(manifest_path, "w", encoding="utf-8") as output:
              output.write("# RU ASN membership: five RIR delegated statistics files; BGP prefixes: ipverse/as-ip-blocks\n")
              output.write("ASN\tHANDLE\tDESCRIPTION\tRIR_REGISTRY_COUNTRY\tIPVERSE_COUNTRY_CODE\tIPV4_PREFIXES\tIPV6_PREFIXES\n")
              for asn in sorted(active_ru_asns):
                  row = active_ru_asns[asn]
                  output.write(f"AS{asn}\t{row['handle']}\t{row['description']}\tRU\t{row['ipverse_country']}\t{row['ipv4']}\t{row['ipv6']}\n")

          stats = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"ipverse aggregated.json files: {archive_json_files}",
              f"RIR delegated-stats registered RU ASNs: {len(registered_ru_asns)}",
              f"RU-registered ASNs with active ipverse BGP data: {len(active_ru_asns)}",
              f"Unique additive BGP prefixes: {len(prefix_origins)}",
              f"Raw IPv4 prefixes: {raw_v4}",
              f"Raw IPv6 prefixes: {raw_v6}",
              f"Prefixes originated by multiple RU ASNs: {sum(1 for values in prefix_origins.values() if len(values) > 1)}",
              f"Invalid/default prefixes skipped: {invalid_prefixes}",
              "ipverse countryCode mismatches (audit only): " + (", ".join(f"{key}={value}" for key, value in sorted(metadata_country_mismatch.items())) or "none"),
          ]
          with open(stats_path, "w", encoding="utf-8") as output:
              output.write("\n".join(stats) + "\n")
          print("=== Additive RU ASN/BGP extraction ===")
          print("\n".join(stats))
          PY

          python3 extract_ru_asn_prefixes.py "$IPVERSE_BGP_ARCHIVE" "$RU_ASN_REGISTRY" \
            "$RU_PREFIX_INPUT" "$ASN_MANIFEST" "$ASN_STATS"
          test -s "$RU_PREFIX_INPUT"
          test -s "$ASN_MANIFEST"
          test -s "$ASN_STATS"

      - name: Build union of preserved core RU sources plus ASN/BGP additions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geoip-builder
          cat > geoip-builder/main.go <<'GO'
          package main
          
          import (
          	"bufio"
          	"fmt"
          	"math/big"
          	"net/netip"
          	"os"
          	"sort"
          	"strings"
          
          	router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )
          
          type sourceFile struct {
          	Name string
          	Path string
          	Kind string
          }
          
          type trieNode struct {
          	covered bool
          	child   [2]*trieNode
          }
          
          type ipTrie struct {
          	v4 *trieNode
          	v6 *trieNode
          }
          
          func newIPTrie() *ipTrie {
          	return &ipTrie{v4: &trieNode{}, v6: &trieNode{}}
          }
          
          func normalizeName(value string) string { return strings.ToLower(strings.TrimSpace(value)) }
          
          func getBit(addr netip.Addr, pos int) int {
          	if addr.Is4() {
          		b := addr.As4()
          		return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          	}
          	b := addr.As16()
          	return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          }
          
          func setBit(addr netip.Addr, pos int) netip.Addr {
          	if addr.Is4() {
          		b := addr.As4()
          		b[pos/8] |= 1 << (7 - (pos % 8))
          		return netip.AddrFrom4(b)
          	}
          	b := addr.As16()
          	b[pos/8] |= 1 << (7 - (pos % 8))
          	return netip.AddrFrom16(b)
          }
          
          func (t *ipTrie) insert(prefix netip.Prefix) {
          	prefix = prefix.Masked()
          	addr, bits := prefix.Addr(), prefix.Bits()
          	curr := t.v6
          	if addr.Is4() {
          		curr = t.v4
          	}
          	for i := 0; i < bits; i++ {
          		if curr.covered {
          			return
          		}
          		bit := getBit(addr, i)
          		if curr.child[bit] == nil {
          			curr.child[bit] = &trieNode{}
          		}
          		curr = curr.child[bit]
          	}
          	curr.covered = true
          	curr.child[0], curr.child[1] = nil, nil
          }
          
          func compressNode(n *trieNode) bool {
          	if n == nil {
          		return false
          	}
          	if n.covered {
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	if !compressNode(n.child[0]) {
          		n.child[0] = nil
          	}
          	if !compressNode(n.child[1]) {
          		n.child[1] = nil
          	}
          	if n.child[0] != nil && n.child[0].covered && n.child[1] != nil && n.child[1].covered {
          		n.covered = true
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	return n.child[0] != nil || n.child[1] != nil
          }
          
          func (t *ipTrie) compress() {
          	if !compressNode(t.v4) {
          		t.v4 = &trieNode{}
          	}
          	if !compressNode(t.v6) {
          		t.v6 = &trieNode{}
          	}
          }
          
          func cloneNode(n *trieNode) *trieNode {
          	if n == nil {
          		return nil
          	}
          	copyNode := &trieNode{covered: n.covered}
          	copyNode.child[0] = cloneNode(n.child[0])
          	copyNode.child[1] = cloneNode(n.child[1])
          	return copyNode
          }
          
          func cloneTrie(source *ipTrie) *ipTrie {
          	return &ipTrie{v4: cloneNode(source.v4), v6: cloneNode(source.v6)}
          }
          
          // Return only address space present in both tries.
          func intersectNode(target, mask *trieNode) *trieNode {
          	if target == nil || mask == nil {
          		return nil
          	}
          	if mask.covered {
          		return cloneNode(target)
          	}
          	if target.covered {
          		target = &trieNode{child: [2]*trieNode{{covered: true}, {covered: true}}}
          	}
          	out := &trieNode{}
          	for bit := 0; bit < 2; bit++ {
          		out.child[bit] = intersectNode(target.child[bit], mask.child[bit])
          	}
          	if out.child[0] == nil && out.child[1] == nil {
          		return nil
          	}
          	if out.child[0] != nil && out.child[0].covered && out.child[1] != nil && out.child[1].covered {
          		return &trieNode{covered: true}
          	}
          	return out
          }
          
          func (t *ipTrie) intersect(mask *ipTrie) {
          	t.v4 = intersectNode(t.v4, mask.v4)
          	t.v6 = intersectNode(t.v6, mask.v6)
          	if t.v4 == nil {
          		t.v4 = &trieNode{}
          	}
          	if t.v6 == nil {
          		t.v6 = &trieNode{}
          	}
          	t.compress()
          }
          
          func subtractNode(target, mask *trieNode) {
          	if target == nil || mask == nil {
          		return
          	}
          	if mask.covered {
          		target.covered = false
          		target.child[0], target.child[1] = nil, nil
          		return
          	}
          	if target.covered {
          		target.covered = false
          		target.child[0] = &trieNode{covered: true}
          		target.child[1] = &trieNode{covered: true}
          	}
          	if mask.child[0] != nil && target.child[0] != nil {
          		subtractNode(target.child[0], mask.child[0])
          	}
          	if mask.child[1] != nil && target.child[1] != nil {
          		subtractNode(target.child[1], mask.child[1])
          	}
          }
          
          func (t *ipTrie) subtract(mask *ipTrie) {
          	subtractNode(t.v4, mask.v4)
          	subtractNode(t.v6, mask.v6)
          	t.compress()
          }
          
          func extractPrefixes(n *trieNode, addr netip.Addr, depth, bitLen int, out *[]netip.Prefix) {
          	if n == nil {
          		return
          	}
          	if n.covered {
          		*out = append(*out, netip.PrefixFrom(addr, depth).Masked())
          		return
          	}
          	if depth >= bitLen {
          		return
          	}
          	if n.child[0] != nil {
          		extractPrefixes(n.child[0], addr, depth+1, bitLen, out)
          	}
          	if n.child[1] != nil {
          		extractPrefixes(n.child[1], setBit(addr, depth), depth+1, bitLen, out)
          	}
          }
          
          func (t *ipTrie) toPrefixes() []netip.Prefix {
          	var out []netip.Prefix
          	extractPrefixes(t.v4, netip.IPv4Unspecified(), 0, 32, &out)
          	extractPrefixes(t.v6, netip.IPv6Unspecified(), 0, 128, &out)
          	return out
          }
          
          func isBlockedCategory(category string) bool {
          	category = normalizeName(category)
          	for _, name := range []string{"ru-blocked", "ru-blocked-community", "re-filter", "category-ban-ru"} {
          		if category == name {
          			return true
          		}
          	}
          	for _, token := range []string{"blocked", "blacklist", "deny", "antifilter", "re-filter"} {
          		if strings.Contains(category, token) {
          			return true
          		}
          	}
          	return false
          }
          
          // Geographic RU categories form the preserved core. Direct/whitelist
          // categories are only candidates: they are not proof of Russian ownership.
          func targetCategory(source, category string) string {
          	source, category = normalizeName(source), normalizeName(category)
          	if isBlockedCategory(category) {
          		return ""
          	}
          	// Ignore generic PRIVATE entries from full GeoIP feeds (notably v2fly).
          	// The PRIVATE category is built only from IANA/built-in exclusions and the
          	// dedicated Loyalsoldier private.dat source.
          	if category == "private" {
          		if source == "loyalsoldier-private" {
          			return "private"
          		}
          		return ""
          	}
          	switch source {
          	case "hydra":
          		if category == "ru" {
          			return "ru"
          		}
          		if category == "direct" || category == "whitelist" {
          			return "candidate"
          		}
          	case "grimbird":
          		if category == "ru" {
          			return "ru"
          		}
          		if strings.HasPrefix(category, "ru-") {
          			if strings.Contains(category, "direct") || strings.Contains(category, "whitelist") || strings.Contains(category, "wl-") {
          				return "candidate"
          			}
          			return "ru"
          		}
          	case "digne":
          		// DigneZzZ/routing v2ray/geoip.dat uses the protobuf country code `ru`.
          		// Keep `ru-ip` as a backward-compatible alias for older/custom builds.
          		if category == "ru" || category == "ru-ip" {
          			return "ru"
          		}
          		// Some legacy/custom Digne feeds may expose this candidate category.
          		if category == "direct-ip" {
          			return "candidate"
          		}
          	case "davoyan":
          		if category == "ru" {
          			return "ru"
          		}
          		if category == "wl-ru" {
          			return "candidate"
          		}
          	case "kirill":
          		if category == "whitelist" {
          			return "candidate"
          		}
          	case "golukon", "loyalsoldier", "v2fly", "v24-baseline":
          		// v2fly and the v24 release regression floor are protected RU sources.
          		// Accept only the exact RU entry from these protobuf databases.
          		if category == "ru" {
          			return "ru"
          		}
          	}
          	return ""
          }
          
          func cidrPrefix(cidr *router.CIDR) (netip.Prefix, bool) {
          	if cidr == nil || cidr.Prefix > 128 {
          		return netip.Prefix{}, false
          	}
          	var addr netip.Addr
          	switch len(cidr.Ip) {
          	case 4:
          		var b [4]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom4(b)
          	case 16:
          		var b [16]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom16(b)
          	default:
          		return netip.Prefix{}, false
          	}
          	if int(cidr.Prefix) > addr.BitLen() {
          		return netip.Prefix{}, false
          	}
          	return netip.PrefixFrom(addr, int(cidr.Prefix)).Masked(), true
          }
          
          func loadGeoIP(path string) (*router.GeoIPList, error) {
          	data, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          	if len(data) == 0 {
          		return nil, fmt.Errorf("empty GeoIP file: %s", path)
          	}
          	list := new(router.GeoIPList)
          	if err := proto.Unmarshal(data, list); err != nil {
          		return nil, fmt.Errorf("invalid GeoIP %s: %w", path, err)
          	}
          	return list, nil
          }
          
          func loadTextPrefixes(trie *ipTrie, path string) (int, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return 0, err
          	}
          	defer file.Close()
          	added := 0
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "IPSET,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		fields := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\t' || r == ',' || r == ';' })
          		for _, field := range fields {
          			field = strings.Trim(field, "[](){}\"'")
          			if field == "" {
          				continue
          			}
          			if prefix, parseErr := netip.ParsePrefix(field); parseErr == nil {
          				if prefix.Bits() == 0 {
          					continue
          				}
          				trie.insert(prefix)
          				added++
          				break
          			}
          			if addr, parseErr := netip.ParseAddr(field); parseErr == nil {
          				trie.insert(netip.PrefixFrom(addr, addr.BitLen()).Masked())
          				added++
          				break
          			}
          		}
          	}
          	if err := scanner.Err(); err != nil {
          		return added, err
          	}
          	return added, nil
          }
          
          func insertBuiltInPrivate(t *ipTrie) {
          	for _, value := range []string{
          		"0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8",
          		"169.254.0.0/16", "172.16.0.0/12", "192.0.0.0/24", "192.0.2.0/24",
          		"192.88.99.0/24", "192.168.0.0/16", "198.18.0.0/15", "198.51.100.0/24",
          		"203.0.113.0/24", "224.0.0.0/4", "240.0.0.0/4",
          		"::/128", "::1/128", "::ffff:0:0/96", "64:ff9b::/96", "100::/64",
          		"2001::/23", "2001:db8::/32", "fc00::/7", "fe80::/10", "ff00::/8",
          	} {
          		if p, err := netip.ParsePrefix(value); err == nil {
          			t.insert(p)
          		}
          	}
          }
          
          func loadGeoIPSource(source sourceFile, coreRU, directCandidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU, protectedV24RU *ipTrie) (matched, candidateMatched int, err error) {
          	list, err := loadGeoIP(source.Path)
          	if err != nil {
          		return 0, 0, err
          	}
          	for _, entry := range list.Entry {
          		if entry == nil {
          			continue
          		}
          		target := targetCategory(source.Name, entry.CountryCode)
          		if target == "" {
          			continue
          		}
          		for _, cidr := range entry.Cidr {
          			prefix, ok := cidrPrefix(cidr)
          			if !ok {
          				continue
          			}
          			switch target {
          			case "private":
          				privateTrie.insert(prefix)
          			case "candidate":
          				directCandidates.insert(prefix)
          				candidateMatched++
          			case "ru":
          				coreRU.insert(prefix)
          				// Loyalsoldier geoip:ru is the protected, already-validated baseline.
          				// Keep its entire address space separately so candidate filtering from
          				// other feeds can never remove it from the final RU category.
          				if source.Name == "loyalsoldier" {
          					protectedLoyalsoldierRU.insert(prefix)
          				}
          				if source.Name == "v2fly" {
          					protectedV2FlyRU.insert(prefix)
          				}
          				if source.Name == "v24-baseline" {
          					protectedV24RU.insert(prefix)
          				}
          			}
          			matched++
          		}
          	}
          	return matched, candidateMatched, nil
          }
          
          func sortPrefixes(prefixes []netip.Prefix) {
          	sort.Slice(prefixes, func(i, j int) bool {
          		if prefixes[i].Addr().BitLen() != prefixes[j].Addr().BitLen() {
          			return prefixes[i].Addr().BitLen() < prefixes[j].Addr().BitLen()
          		}
          		if cmp := prefixes[i].Addr().Compare(prefixes[j].Addr()); cmp != 0 {
          			return cmp < 0
          		}
          		return prefixes[i].Bits() < prefixes[j].Bits()
          	})
          }
          
          func countAddressSpace(prefixes []netip.Prefix, bitLen int) *big.Int {
          	total := new(big.Int)
          	for _, prefix := range prefixes {
          		if prefix.Addr().BitLen() != bitLen {
          			continue
          		}
          		count := new(big.Int).Lsh(big.NewInt(1), uint(bitLen-prefix.Bits()))
          		total.Add(total, count)
          	}
          	return total
          }
          
          func writeOutput(priv, ru []netip.Prefix, path string) ([]byte, error) {
          	result := new(router.GeoIPList)
          	for _, target := range []struct {
          		name     string
          		prefixes []netip.Prefix
          	}{{"PRIVATE", priv}, {"RU", ru}} {
          		if len(target.prefixes) == 0 {
          			continue
          		}
          		entry := &router.GeoIP{CountryCode: target.name}
          		for _, prefix := range target.prefixes {
          			if prefix.Addr().Is4() {
          				a := prefix.Addr().As4()
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: []byte{a[0], a[1], a[2], a[3]}, Prefix: uint32(prefix.Bits())})
          			} else {
          				a := prefix.Addr().As16()
          				ip := make([]byte, 16)
          				copy(ip, a[:])
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: ip, Prefix: uint32(prefix.Bits())})
          			}
          		}
          		result.Entry = append(result.Entry, entry)
          	}
          	data, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
          	if err != nil {
          		return nil, err
          	}
          	return data, os.WriteFile(path, data, 0644)
          }
          
          func writeCategories(path string, privateCount, ruCount int) error {
          	return os.WriteFile(path, []byte(fmt.Sprintf("RU\t%d\nPRIVATE\t%d\n", ruCount, privateCount)), 0644)
          }
          
          func writeSourceCounts(path string, counts map[string]int) error {
          	order := []string{"hydra", "grimbird", "digne", "davoyan", "kirill", "golukon", "v2fly", "v24-baseline", "loyalsoldier", "hxehex-whitelist", "w1zardz-ru", "ru-asn-bgp", "loyalsoldier-private"}
          	var b strings.Builder
          	b.WriteString("SOURCE\tPARSED_CIDR_INPUTS\n")
          	for _, name := range order {
          		fmt.Fprintf(&b, "%s\t%d\n", name, counts[name])
          	}
          	return os.WriteFile(path, []byte(b.String()), 0644)
          }
          
          func writeSources(path string, coreRaw, coreUnique, filteredCoreUnique, excludedCoreUnique, loyalsoldierRaw, loyalsoldierUnique, v2flyRaw, v2flyUnique, v24BaselineRaw, v24BaselineUnique, candidateRaw, candidateUnique, candidateMatched, candidateUnmatched, candidateProtectedUnique, bgpRaw, bgpUnique, newUnique, ruCount, privateCount int, ipv4Count, ipv6Count string) error {
          	content := fmt.Sprintf(`GeoIP Russia CLIENT v27 (monotonic v24 baseline + protected Loyalsoldier/v2fly RU + additive sources and RIR/ASN/BGP; dual-stack)
          
          Protected geographic RU baselines:
          - Published v24 geoip:RU address space is the regression floor; every public address from v24 must survive v27.
          - Loyalsoldier/geoip: ru category is a protected baseline.
          - v2fly/geoip: only its exact ru category is accepted and protected; all other country categories are ignored.
          - Direct/whitelist candidate ranges cannot subtract or override any protected baseline.
          
          Additional geographic RU sources:
          - hydraponique/roscomvpn-geoip: ru category only
          - GrimbirdUsers/ru-routing-dat: ru and ru-* geographic entries, excluding explicitly blocked/deny and direct/whitelist subcategories
          - DigneZzZ/routing v2ray/geoip.dat: ru category (legacy ru-ip alias accepted)
          - Davoyan/xray-routing: ru category only
          - golukon/russia-only-geoip: ru
          - v2fly/geoip project license: CC-BY-SA-4.0; its README also identifies embedded DB-IP data under CC-BY-4.0. Preserve upstream attribution and license notices when redistributing derived data.
          - Other accepted geographic RU sources supplement the protected baselines.
          
          Direct/whitelist inputs are candidates, NOT geographic RU proof:
          - Hydra direct/whitelist categories
          - Digne direct-ip is accepted only as a candidate if present in a legacy/custom DAT; current upstream v2ray/geoip.dat publishes ru, whitelist (legacy alias), blocked-ru, private and telegram categories.
          - Davoyan wl-ru category
          - kirilllavrov/RU-domain-list-for-whitelist whitelist category
          - hxehex/russia-mobile-internet-whitelist CIDR whitelist
          - w1zardz/amnezia-vpn-russia-split-tunneling ru-direct-ipv4
          - Candidate-only ranges are not copied wholesale to geoip:RU.
          - Candidate portions not covered by current RU-ASN BGP may be removed only from additional feeds outside v24, Loyalsoldier RU and v2fly RU protected baselines.
          - Candidate portions covered by RU-ASN BGP are retained by the ASN/BGP supplement.
          
          Additive ASN/BGP supplement:
          - AFRINIC, APNIC, ARIN, LACNIC and RIPE NCC delegated statistics identify RU ASNs (allocated, assigned and legacy records).
          - ipverse/as-ip-blocks supplies currently announced IPv4/IPv6 prefixes for those RU-registered ASNs.
          - RIR country code identifies the registration country of an ASN, not its physical hosting location.
          - ipverse metadata country is audit-only and does not gate RU-ASN selection.
          
          Final rule:
          - RU = protected v24 geoip:RU UNION protected Loyalsoldier geoip:ru UNION protected v2fly geoip:ru UNION eligible additional geographic RU sources UNION current prefixes originated by RU-registered ASNs.
          - Candidate carve-out applies only to additional unprotected sources; it cannot remove public address space from the three protected baselines.
          - PRIVATE is built from built-in special-purpose exclusions and the dedicated Loyalsoldier private.dat only. Generic private entries from other feeds (including v2fly) are ignored.
          - If a newer PRIVATE input overlaps v24's already-published RU category, v24 takes priority so the previous RU coverage cannot shrink.
          - No new GeoIP categories are created; output remains RU and PRIVATE.
          - IPv4 and IPv6 are supported.
          
          Build counters:
          Geographic RU core CIDR inputs: %d
          Unique geographic core prefixes before candidate carve-out: %d
          Geographic core prefixes after candidate carve-out: %d
          Core prefixes excluded by unconfirmed direct candidates: %d
          Loyalsoldier RU CIDR inputs (protected): %d
          Unique Loyalsoldier protected prefixes: %d
          v2fly RU CIDR inputs (protected): %d
          Unique v2fly protected prefixes: %d
          v24 RU baseline CIDR inputs (protected): %d
          Unique v24 protected prefixes: %d
          Direct/whitelist candidate CIDR inputs: %d
          Unique direct/whitelist candidate prefixes: %d
          Candidate prefixes overlapping RU-ASN BGP space: %d
          Candidate prefixes not covered by RU-ASN BGP: %d
          Candidate prefixes protected by all baselines: %d
          RU ASN/BGP CIDR inputs: %d
          Unique RU ASN/BGP prefixes: %d
          New address-space prefixes added by ASN/BGP beyond geographic core: %d
          Final output RU CIDRs: %d
          Final output PRIVATE CIDRs: %d
          Final IPv4 address count: %s
          Final IPv6 address count: %s
          `, coreRaw, coreUnique, filteredCoreUnique, excludedCoreUnique, loyalsoldierRaw, loyalsoldierUnique, v2flyRaw, v2flyUnique, v24BaselineRaw, v24BaselineUnique, candidateRaw, candidateUnique, candidateMatched, candidateUnmatched, candidateProtectedUnique, bgpRaw, bgpUnique, newUnique, ruCount, privateCount, ipv4Count, ipv6Count)
          	return os.WriteFile(path, []byte(content), 0644)
          }
          
          func main() {
          	if len(os.Args) != 18 {
          		fmt.Fprintf(os.Stderr, "usage: %s <hydra> <grimbird> <digne> <davoyan> <kirill> <golukon> <v2fly> <v24-baseline> <loyalsoldier-ru> <loyalsoldier-private> <hxehex> <w1zardz> <ru-asn-bgp> <output> <categories> <sources> <source-counts>\n", os.Args[0])
          		os.Exit(2)
          	}
          	files := []sourceFile{
          		{"hydra", os.Args[1], "dat"},
          		{"grimbird", os.Args[2], "dat"},
          		{"digne", os.Args[3], "dat"},
          		{"davoyan", os.Args[4], "dat"},
          		{"kirill", os.Args[5], "dat"},
          		{"golukon", os.Args[6], "dat"},
          		{"v2fly", os.Args[7], "dat"},
          		{"v24-baseline", os.Args[8], "dat"},
          		{"loyalsoldier", os.Args[9], "dat"},
          		{"loyalsoldier-private", os.Args[10], "dat"},
          		{"hxehex-whitelist", os.Args[11], "text"},
          		{"w1zardz-ru", os.Args[12], "text"},
          		{"ru-asn-bgp", os.Args[13], "text"},
          	}
          	outputPath, categoryPath, sourcePath, countsPath := os.Args[14], os.Args[15], os.Args[16], os.Args[17]
          
          	coreRU, directCandidates, asnRU, privateTrie := newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie()
          	protectedLoyalsoldierRU := newIPTrie()
          	protectedV2FlyRU := newIPTrie()
          	protectedV24RU := newIPTrie()
          	insertBuiltInPrivate(privateTrie)
          	counts := make(map[string]int)
          	coreRaw, candidateRaw, bgpRaw := 0, 0, 0
          
          	for _, source := range files {
          		if source.Kind == "dat" {
          			matched, matchedCandidates, err := loadGeoIPSource(source, coreRU, directCandidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU, protectedV24RU)
          			if err != nil {
          				panic(fmt.Errorf("%s: %w", source.Name, err))
          			}
          			counts[source.Name] = matched
          			if matched == 0 {
          				panic(fmt.Errorf("source %s has no accepted CIDRs; refusing to silently drop this source", source.Name))
          			}
          			if source.Name != "loyalsoldier-private" {
          				candidateRaw += matchedCandidates
          				coreRaw += matched - matchedCandidates
          			}
          			fmt.Printf("Loaded core %-20s matched_cidrs=%d\n", source.Name, matched)
          			continue
          		}
          
          		targetTrie := directCandidates
          		if source.Name == "ru-asn-bgp" {
          			targetTrie = asnRU
          		}
          		matched, err := loadTextPrefixes(targetTrie, source.Path)
          		if err != nil {
          			panic(fmt.Errorf("%s: %w", source.Name, err))
          		}
          		counts[source.Name] = matched
          		if source.Name == "ru-asn-bgp" {
          			bgpRaw = matched
          		} else {
          			candidateRaw += matched
          		}
          		if matched == 0 {
          			panic(fmt.Errorf("source %s parsed zero prefixes; refusing incomplete build", source.Name))
          		}
          		fmt.Printf("Loaded candidate/supplement %-14s cidrs=%d\n", source.Name, matched)
          	}
          
          	coreRU.compress()
          	directCandidates.compress()
          	asnRU.compress()
          	privateTrie.compress()
          	protectedLoyalsoldierRU.compress()
          	protectedV2FlyRU.compress()
          	protectedV24RU.compress()
          	// Preserve v24's already-published RU set as-is: newer private metadata
          	// cannot retroactively remove an address that v24 shipped in geoip:RU.
          	privateTrie.subtract(protectedV24RU)
          	privateTrie.compress()
          	if len(protectedLoyalsoldierRU.toPrefixes()) == 0 {
          		panic("Loyalsoldier geoip:ru protected baseline is empty; refusing to publish")
          	}
          	if len(protectedV2FlyRU.toPrefixes()) == 0 {
          		panic("v2fly geoip:ru protected baseline is empty; refusing to publish")
          	}
          	if len(protectedV24RU.toPrefixes()) == 0 {
          		panic("v24 RU regression baseline is empty; refusing to publish")
          	}
          	coreUnique := len(coreRU.toPrefixes())
          	loyalsoldierUnique := len(protectedLoyalsoldierRU.toPrefixes())
          	v2flyUnique := len(protectedV2FlyRU.toPrefixes())
          	v24BaselineUnique := len(protectedV24RU.toPrefixes())
          	candidateUnique := len(directCandidates.toPrefixes())
          	candidateCovered := cloneTrie(directCandidates)
          	candidateCovered.intersect(asnRU)
          	candidateMatched := len(candidateCovered.toPrefixes())
          	candidateNotCovered := cloneTrie(directCandidates)
          	candidateNotCovered.subtract(asnRU)
          	candidateUnmatched := len(candidateNotCovered.toPrefixes())
          	// Protect all baseline address space from direct/whitelist candidate carving.
          	protectedGeoRU := cloneTrie(protectedLoyalsoldierRU)
          	for _, prefix := range protectedV2FlyRU.toPrefixes() {
          		protectedGeoRU.insert(prefix)
          	}
          	for _, prefix := range protectedV24RU.toPrefixes() {
          		protectedGeoRU.insert(prefix)
          	}
          	protectedGeoRU.compress()
          	candidateProtected := cloneTrie(candidateNotCovered)
          	candidateProtected.intersect(protectedGeoRU)
          	candidateCarve := cloneTrie(candidateNotCovered)
          	candidateCarve.subtract(protectedLoyalsoldierRU)
          	candidateCarve.subtract(protectedV2FlyRU)
          	candidateCarve.subtract(protectedV24RU)
          	candidateProtectedUnique := len(candidateProtected.toPrefixes())
          	filteredCore := cloneTrie(coreRU)
          	filteredCore.subtract(candidateCarve)
          	filteredCore.compress()
          	filteredCoreUnique := len(filteredCore.toPrefixes())
          	excludedCore := cloneTrie(coreRU)
          	excludedCore.subtract(filteredCore)
          	excludedCoreUnique := len(excludedCore.toPrefixes())
          	bgpUnique := len(asnRU.toPrefixes())
          	if coreRaw == 0 || coreUnique == 0 {
          		panic("core RU sources produced an empty set; refusing to publish")
          	}
          	if bgpRaw == 0 || bgpUnique == 0 {
          		panic("RU ASN/BGP supplement is empty; refusing to publish")
          	}
          
          	// Add RU-ASN BGP prefixes to the geographic core after unconfirmed direct/whitelist-only portions have been carved out.
          	combinedRU := cloneTrie(filteredCore)
          	for _, prefix := range asnRU.toPrefixes() {
          		combinedRU.insert(prefix)
          	}
          	combinedRU.compress()
          
          	// Exclude special/private ranges into the existing PRIVATE category only.
          	corePublic := cloneTrie(filteredCore)
          	corePublic.subtract(privateTrie)
          	finalRU := cloneTrie(combinedRU)
          	finalRU.subtract(privateTrie)
          	finalRU.compress()
          
          	// Invariant: every non-private address in the filtered geographic core must remain in final RU.
          	lostCore := cloneTrie(corePublic)
          	lostCore.subtract(finalRU)
          	lostCore.compress()
          	if lost := lostCore.toPrefixes(); len(lost) != 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("core-source preservation invariant failed: %d prefixes lost, first=%s", len(lost), lost[0]))
          	}
          	// Invariant 2: preserve every non-private address from Loyalsoldier geoip:ru.
          	protectedLoyalsoldierPublic := cloneTrie(protectedLoyalsoldierRU)
          	protectedLoyalsoldierPublic.subtract(privateTrie)
          	lostLoyalsoldier := cloneTrie(protectedLoyalsoldierPublic)
          	lostLoyalsoldier.subtract(finalRU)
          	if lost := lostLoyalsoldier.toPrefixes(); len(lost) != 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("Loyalsoldier geoip:ru preservation invariant failed: %d prefixes lost, first=%s", len(lost), lost[0]))
          	}
          	protectedV2FlyPublic := cloneTrie(protectedV2FlyRU)
          	protectedV2FlyPublic.subtract(privateTrie)
          	lostV2Fly := cloneTrie(protectedV2FlyPublic)
          	lostV2Fly.subtract(finalRU)
          	if lost := lostV2Fly.toPrefixes(); len(lost) != 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("v2fly geoip:ru preservation invariant failed: %d prefixes lost, first=%s", len(lost), lost[0]))
          	}
          	protectedV24Public := cloneTrie(protectedV24RU)
          	lostV24 := cloneTrie(protectedV24Public)
          	lostV24.subtract(finalRU)
          	if lost := lostV24.toPrefixes(); len(lost) != 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("v24 regression invariant failed: %d prefixes lost, first=%s", len(lost), lost[0]))
          	}
          
          	// Count only the address space contributed by ASN/BGP that was not already in the core set.
          	newOnly := cloneTrie(finalRU)
          	newOnly.subtract(corePublic)
          	newOnly.compress()
          	newUnique := len(newOnly.toPrefixes())
          
          	privatePrefixes := privateTrie.toPrefixes()
          	ruPrefixes := finalRU.toPrefixes()
          	sortPrefixes(privatePrefixes)
          	sortPrefixes(ruPrefixes)
          	ipv4Count := countAddressSpace(ruPrefixes, 32).String()
          	ipv6Count := countAddressSpace(ruPrefixes, 128).String()
          	if len(ruPrefixes) == 0 {
          		panic("final RU category is empty; refusing to publish")
          	}
          
          	data, err := writeOutput(privatePrefixes, ruPrefixes, outputPath)
          	if err != nil {
          		panic(fmt.Errorf("write GeoIP protobuf: %w", err))
          	}
          	if err := writeCategories(categoryPath, len(privatePrefixes), len(ruPrefixes)); err != nil {
          		panic(err)
          	}
          	if err := writeSourceCounts(countsPath, counts); err != nil {
          		panic(err)
          	}
          	if err := writeSources(sourcePath, coreRaw, coreUnique, filteredCoreUnique, excludedCoreUnique, counts["loyalsoldier"], loyalsoldierUnique, counts["v2fly"], v2flyUnique, counts["v24-baseline"], v24BaselineUnique, candidateRaw, candidateUnique, candidateMatched, candidateUnmatched, candidateProtectedUnique, bgpRaw, bgpUnique, newUnique, len(ruPrefixes), len(privatePrefixes), ipv4Count, ipv6Count); err != nil {
          		panic(err)
          	}
          
          	fmt.Println("============================================================")
          	fmt.Println("ULTIMATE GEOIP RUSSIA CLIENT v27 (MONOTONIC V24 + PROTECTED LOYALSOLDIER/V2FLY RU + ADDITIVE ASN/BGP)")
          	fmt.Println("============================================================")
          	fmt.Printf("Geographic core source CIDR inputs  : %d\n", coreRaw)
          	fmt.Printf("Unique geographic core before carve : %d\n", coreUnique)
          	fmt.Printf("Unique geographic core after carve  : %d\n", filteredCoreUnique)
          	fmt.Printf("Core prefixes carved as unconfirmed : %d\n", excludedCoreUnique)
          	fmt.Printf("Loyalsoldier RU CIDR inputs (protected): %d\n", counts["loyalsoldier"])
          	fmt.Printf("Unique Loyalsoldier protected prefixes : %d\n", loyalsoldierUnique)
          	fmt.Printf("v2fly RU CIDR inputs (protected)        : %d\n", counts["v2fly"])
          	fmt.Printf("Unique v2fly protected prefixes        : %d\n", v2flyUnique)
          	fmt.Printf("v24 RU baseline CIDR inputs (protected): %d\n", counts["v24-baseline"])
          	fmt.Printf("Unique v24 protected prefixes          : %d\n", v24BaselineUnique)
          	fmt.Printf("Candidate prefixes protected by all baselines: %d\n", candidateProtectedUnique)
          	fmt.Printf("Direct/whitelist candidate inputs   : %d\n", candidateRaw)
          	fmt.Printf("Unique direct/whitelist candidates  : %d\n", candidateUnique)
          	fmt.Printf("Candidates covered by RU ASN/BGP   : %d\n", candidateMatched)
          	fmt.Printf("Candidates not covered by RU ASN   : %d\n", candidateUnmatched)
          	fmt.Printf("RU ASN/BGP CIDR inputs              : %d\n", bgpRaw)
          	fmt.Printf("Unique RU ASN/BGP prefixes          : %d\n", bgpUnique)
          	fmt.Printf("New address space added by ASN/BGP  : %d prefixes\n", newUnique)
          	fmt.Printf("Output geoip:RU                     : %d CIDRs\n", len(ruPrefixes))
          	fmt.Printf("Output geoip:PRIVATE                : %d CIDRs\n", len(privatePrefixes))
          	fmt.Printf("Final file size                     : %d bytes\n", len(data))
          	fmt.Printf("Final IPv4 address coverage           : %s\n", ipv4Count)
          	fmt.Printf("Final IPv6 address coverage           : %s\n", ipv6Count)
          	fmt.Println("Filtered geographic-core invariant     : PASSED")
          	fmt.Println("Loyalsoldier RU preservation invariant : PASSED")
          	fmt.Println("v2fly RU preservation invariant        : PASSED")
          	fmt.Println("v24 monotonic regression invariant      : PASSED")
          }
          GO

          gofmt -w geoip-builder/main.go
          cd geoip-builder
          GOFLAGS=-mod=mod go mod init geoip-builder
          GOFLAGS=-mod=mod go get github.com/v2fly/v2ray-core/v5/app/router/routercommon@latest
          GOFLAGS=-mod=mod go get google.golang.org/protobuf@latest
          GOFLAGS=-mod=mod go build -o /tmp/geoip-russia-additive-builder .
          cd ..

          /tmp/geoip-russia-additive-builder \
            "$HYDRA_INPUT" \
            "$GRIMBIRD_INPUT" \
            "$DIGNE_INPUT" \
            "$DAVOYAN_INPUT" \
            "$KIRILL_INPUT" \
            "$GOLUKON_INPUT" \
            "$V2FLY_INPUT" \
            "$V24_BASELINE_INPUT" \
            "$LOYALSOLDIER_RU_INPUT" \
            "$LOYALSOLDIER_PRIVATE_INPUT" \
            "$HXEHEX_INPUT" \
            "$W1ZARDZ_INPUT" \
            "$RU_PREFIX_INPUT" \
            "$OUTPUT_FILE" \
            "$CATEGORY_FILE" \
            "$SOURCE_FILE" \
            "$SOURCE_COUNTS"

          test -s "$OUTPUT_FILE"
          test -s "$CATEGORY_FILE"
          test -s "$SOURCE_FILE"
          test -s "$SOURCE_COUNTS"

      - name: Validate preservation and final GeoIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUTPUT_FILE" "$ASN_MANIFEST" "$ASN_STATS" "$SOURCE_COUNTS" <<'PY'
          import os, sys
          output, manifest, stats, counts = sys.argv[1:]
          for path, minimum in ((output, 4), (manifest, 100), (stats, 100), (counts, 50)):
              if not os.path.isfile(path) or os.path.getsize(path) < minimum:
                  raise SystemExit(f"Missing or unexpectedly small build artifact: {path}")
          with open(counts, encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          count_map = {row[0]: int(row[1]) for row in rows[1:] if len(row) == 2}
          required = ("hydra", "grimbird", "digne", "davoyan", "kirill", "golukon", "v2fly", "v24-baseline", "loyalsoldier", "loyalsoldier-private", "hxehex-whitelist", "w1zardz-ru", "ru-asn-bgp")
          missing = [name for name in required if count_map.get(name, 0) <= 0]
          if missing:
              raise SystemExit("Required core/supplement source contributed zero CIDRs: " + ", ".join(missing))
          print(f"Validated GeoIP protobuf payload: {os.path.getsize(output)} bytes")
          print("Required core source inputs and additive ASN/BGP supplement are present.")
          print("The Go builder verified preservation of v24, Loyalsoldier RU and v2fly RU public address space.")
          PY

          echo "=== Additive ASN/BGP statistics (RIR registry source) ==="
          cat "$ASN_STATS"
          echo "=== ASN manifest preview ==="
          head -n 15 "$ASN_MANIFEST"
          echo "=== Source contribution counts ==="
          cat "$SOURCE_COUNTS"
          echo "=== GeoIP categories ==="
          cat "$CATEGORY_FILE"
          echo "=== GeoIP source manifest ==="
          cat "$SOURCE_FILE"
          echo "=== SHA256 ==="
          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-geoip-client-v27
          name: "Ultimate GeoIP Russia CLIENT v27 (Monotonic v24 Baseline + Protected Loyalsoldier/v2fly RU + Additive ASN/BGP)"
          make_latest: false
          files: |
            geoip_RU.dat
            geoip_RU.dat.sha256sum
            geoip_RU_categories.txt
            geoip_RU_sources.txt
            geoip_RU_source_counts.txt
            geoip_RU_asn_manifest.txt
            geoip_RU_asn_stats.txt
            geoip_RU_asn_bgp_prefixes.txt
            geoip_RU_registered_asns.txt
          body: |
            # Ultimate GeoIP Russia CLIENT v27

            ## Existing categories
            - `geoip:RU`
            - `geoip:PRIVATE`

            ## Inclusion model
            - The published v24 `geoip:RU` address space is a mandatory regression floor: all its non-private IPv4/IPv6 addresses must survive.
            - Loyalsoldier `geoip:ru` and v2fly `geoip.dat` `ru` category are also protected baselines.
            - Generic `private` entries from v2fly and other full-dataset feeds are ignored; PRIVATE uses built-in special-purpose exclusions and Loyalsoldier `private.dat`.
            - All other accepted geographic RU sources and RU-registered ASN BGP prefixes supplement the protected baselines.
            - Direct/whitelist-only categories are candidates, not geographic RU proof.
            - Hydra direct/whitelist, Digne direct-ip, Davoyan wl-ru, Kirill whitelist, HXEHEX CIDR whitelist, and W1ZARDZ direct-IP candidates are admitted only where they overlap active BGP prefixes originated by RIR-registered RU ASNs.
            - Unconfirmed candidate address space can be carved out only from additional geographic sources outside all protected baselines: v24, Loyalsoldier RU and v2fly RU.
            - v2fly/geoip contributes only its `ru` entry from the complete upstream `geoip.dat`; all other country entries are ignored.
            - Attribution: v2fly/geoip is licensed CC-BY-SA-4.0; the upstream README also identifies DB-IP data under CC-BY-4.0. Retain relevant upstream attribution and license notices when redistributing derived data.
            - RU-registered ASN BGP prefixes from daily ipverse data are added to the protected baseline and other accepted geographic sources.
            - RIR inventory comes from five delegated-stat registries; parser supports formats 2 and 2.3.
            - Zero RU ASN records in an individual RIR file are valid; the merged global inventory is sanity-checked.
            - Only private/reserved ranges are moved to the existing PRIVATE category.
            - No new GeoIP categories are created. IPv4 and IPv6 are supported.

      - name: Publish release branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/geoip-client-release
          mkdir -p /tmp/geoip-client-release
          cp "$OUTPUT_FILE" /tmp/geoip-client-release/geoip_RU.dat
          cp "$OUTPUT_SHA_FILE" /tmp/geoip-client-release/geoip_RU.dat.sha256sum
          cp "$CATEGORY_FILE" /tmp/geoip-client-release/geoip_RU_categories.txt
          cp "$SOURCE_FILE" /tmp/geoip-client-release/geoip_RU_sources.txt
          cp "$SOURCE_COUNTS" /tmp/geoip-client-release/geoip_RU_source_counts.txt
          cp "$ASN_MANIFEST" /tmp/geoip-client-release/geoip_RU_asn_manifest.txt
          cp "$ASN_STATS" /tmp/geoip-client-release/geoip_RU_asn_stats.txt
          cp "$RU_PREFIX_INPUT" /tmp/geoip-client-release/geoip_RU_asn_bgp_prefixes.txt
          cp "$RU_ASN_REGISTRY" /tmp/geoip-client-release/geoip_RU_registered_asns.txt
          cd /tmp/geoip-client-release
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update RU GeoIP: preserve core sources and add ASN/BGP prefixes"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push --force origin release
          curl --silent --show-error "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat" >/dev/null 2>&1 || true
          curl --silent --show-error "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat.sha256sum" >/dev/null 2>&1 || true

