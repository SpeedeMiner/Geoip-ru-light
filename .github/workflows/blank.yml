name: Build Ultimate GeoIP Russia CLIENT v30 (Hydra source classification fix + Quality Edition)

on:
  workflow_dispatch:
  schedule:
    # Daily refresh; existing RU sources remain the base, ASN/BGP only supplements.
    - cron: "45 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: geoip-russia-v30-quality-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      HYDRA_INPUT: hydra-geoip.dat
      GRIMBIRD_INPUT: grimbird-geoip.dat
      DIGNE_INPUT: digne-geoip.dat
      DAVOYAN_INPUT: davoyan-geoip.dat
      KIRILL_INPUT: kirill-geoip.dat
      GOLUKON_INPUT: golukon-geoip.dat
      V2FLY_INPUT: v2fly-geoip.dat
      V2FLY_SHA_INPUT: v2fly-geoip.dat.sha256sum
      LOYALSOLDIER_RU_INPUT: loyalsoldier-ru.dat
      LOYALSOLDIER_PRIVATE_INPUT: loyalsoldier-private.dat
      HXEHEX_INPUT: hxehex-cidrwhitelist.txt
      W1ZARDZ_INPUT: w1zardz-ru-ipv4.txt
      RU_ASN_REGISTRY: geoip_RU_registered_asns.txt
      AFRINIC_STATS: delegated-afrinic-latest
      APNIC_STATS: delegated-apnic-latest
      ARIN_STATS: delegated-arin-extended-latest
      LACNIC_STATS: delegated-lacnic-latest
      RIPENCC_STATS: delegated-ripencc-latest
      IPVERSE_BGP_ARCHIVE: as-ip-blocks.tar.gz
      RU_PREFIX_INPUT: geoip_RU_asn_bgp_prefixes.txt
      RIR_PREFIX_INPUT: geoip_RU_rir_registered_prefixes.txt
      RIR_STATS: geoip_RU_rir_stats.txt
      GLOBAL_BGP_PREFIX_INPUT: geoip_RU_global_bgp_prefixes.txt
      IANA_V4_CSV: iana-ipv4-special-registry.csv
      IANA_V6_CSV: iana-ipv6-special-registry.csv
      IANA_PRIVATE_PREFIX_INPUT: geoip_RU_iana_non_global_prefixes.txt
      IANA_REACHABLE_PREFIX_INPUT: geoip_RU_iana_global_exceptions.txt
      QUALITY_REPORT: geoip_RU_quality_report.txt
      ASN_MANIFEST: geoip_RU_asn_manifest.txt
      ASN_STATS: geoip_RU_asn_stats.txt
      SOURCE_COUNTS: geoip_RU_source_counts.txt
      OUTPUT_FILE: geoip_RU.dat
      CATEGORY_FILE: geoip_RU_categories.txt
      SOURCE_FILE: geoip_RU_sources.txt
      OUTPUT_SHA_FILE: geoip_RU.dat.sha256sum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Download trusted GeoIP sources, additional feeds, RIR, IANA and BGP data
        shell: bash
        run: |
          set -euo pipefail

          download_file() {
            local label="$1"
            local output="$2"
            shift 2
            local tmp="${output}.part"
            local url
            rm -f "$tmp"

            for url in "$@"; do
              echo "::group::${label}"
              echo "Trying: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 180 \
                --retry 4 --retry-all-errors --retry-delay 3 --retry-max-time 240 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]]; then
                  mv "$tmp" "$output"
                  echo "Downloaded ${label}: $(wc -c < "$output") bytes"
                  echo "::endgroup::"
                  return 0
                fi
                echo "Empty response from ${url}"
              else
                echo "Download failed from ${url}"
              fi
              rm -f "$tmp"
              echo "Trying next mirror..."
              echo "::endgroup::"
            done

            echo "::error::Unable to download required source: ${label}"
            return 1
          }

          # Kirill publishes geoip.dat as a GitHub Release asset, not as a file
          # under the main branch. Resolve the latest asset through the official
          # GitHub REST API first; this avoids relying on the browser_download_url
          # host alone when github.com/release-assets returns transient HTTP 5xx.
          download_kirill_geoip() {
            local label="KIRILL RU WHITELIST"
            local output="$KIRILL_INPUT"
            local repo="kirilllavrov/RU-domain-list-for-whitelist"
            local metadata="${output}.release.json"
            local tmp="${output}.part"
            local api_url asset_id="" tag_name="" asset_digest="" asset_info=""
            local expected_sha="" actual_sha="" url
            rm -f "$metadata" "$tmp"

            for api_url in \
              "https://api.github.com/repos/${repo}/releases/latest" \
              "https://api.github.com/repos/${repo}/releases/tags/0.3.11"; do
              echo "Resolving ${label} asset through: ${api_url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 90 \
                --retry 2 --retry-all-errors --retry-delay 2 \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                --header "User-Agent: geoip-russia-builder" \
                --output "$metadata" "$api_url"; then
                asset_info="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); a=next((x for x in d.get("assets", []) if x.get("name") == "geoip.dat"), {}); print("\t".join((str(a.get("id", "")), str(d.get("tag_name", "")), str(a.get("digest", "") or ""))))' "$metadata" 2>/dev/null || true)"
                IFS=$'\t' read -r asset_id tag_name asset_digest <<< "$asset_info"
                if [[ "$asset_id" =~ ^[0-9]+$ ]]; then
                  echo "Found geoip.dat release asset: tag=${tag_name:-unknown}, asset_id=${asset_id}"
                  if curl --fail --location --silent --show-error \
                    --connect-timeout 20 --max-time 240 \
                    --retry 3 --retry-all-errors --retry-delay 3 \
                    --header "Accept: application/octet-stream" \
                    --header "X-GitHub-Api-Version: 2022-11-28" \
                    --header "User-Agent: geoip-russia-builder" \
                    --output "$tmp" \
                    "https://api.github.com/repos/${repo}/releases/assets/${asset_id}"; then
                    if [[ -s "$tmp" ]] && [[ "$(wc -c < "$tmp")" -gt 32 ]] && \
                      python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                      if [[ "$asset_digest" == sha256:* ]]; then
                        expected_sha="${asset_digest#sha256:}"
                        actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                        if [[ "$actual_sha" != "$expected_sha" ]]; then
                          echo "SHA256 mismatch for ${label}: expected=${expected_sha}, actual=${actual_sha}"
                          rm -f "$tmp"
                          continue
                        fi
                      fi
                      mv "$tmp" "$output"
                      rm -f "$metadata"
                      echo "Downloaded and validated ${label} through GitHub Release API: $(wc -c < "$output") bytes"
                      return 0
                    fi
                    echo "GitHub API response is not a valid-looking Xray GeoIP protobuf asset"
                  else
                    echo "GitHub Release API asset download failed for asset_id=${asset_id}"
                  fi
                else
                  echo "Release metadata does not contain geoip.dat"
                fi
              else
                echo "Could not retrieve release metadata from ${api_url}"
              fi
              rm -f "$tmp" "$metadata"
            done

            echo "GitHub API route unavailable; trying official Release URL and independent mirrors"
            for url in \
              "https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.org/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://gh-proxy.com/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghproxy.net/https://github.com/${repo}/releases/latest/download/geoip.dat" \
              "https://ghfast.top/https://github.com/${repo}/releases/latest/download/geoip.dat"; do
              rm -f "$tmp"
              echo "Trying ${label} mirror: ${url}"
              if curl --fail --location --silent --show-error \
                --connect-timeout 20 --max-time 240 \
                --retry 2 --retry-all-errors --retry-delay 3 \
                --output "$tmp" "$url"; then
                if [[ -s "$tmp" ]] && \
                  python3 -c 'import sys; b=open(sys.argv[1], "rb").read(8); sys.exit(0 if len(b) >= 2 and b[0] == 0x0a else 1)' "$tmp"; then
                  if [[ "$asset_digest" == sha256:* ]]; then
                    expected_sha="${asset_digest#sha256:}"
                    actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
                    if [[ "$actual_sha" != "$expected_sha" ]]; then
                      echo "SHA256 mismatch for ${label} mirror ${url}"
                      rm -f "$tmp"
                      continue
                    fi
                  fi
                  mv "$tmp" "$output"
                  echo "Downloaded and validated ${label} from mirror: $(wc -c < "$output") bytes"
                  rm -f "$metadata"
                  return 0
                fi
                echo "Mirror returned an invalid or empty GeoIP protobuf: ${url}"
              else
                echo "Mirror download failed: ${url}"
              fi
            done

            rm -f "$tmp" "$metadata" "$output"
            echo "::error::Unable to download a valid ${label} asset from GitHub API or mirrors"
            return 1
          }

          echo "==============================================="
          echo "Downloading GeoIP sources and trusted RU layers"
          echo "==============================================="

          download_file "HYDRA" "$HYDRA_INPUT" \
            "https://github.com/hydraponique/roscomvpn-geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip@master/release/geoip.dat"

          download_file "GRIMBIRD" "$GRIMBIRD_INPUT" \
            "https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/GrimbirdUsers/ru-routing-dat@main/geoip.dat"

          download_file "DIGNE" "$DIGNE_INPUT" \
            "https://cdn.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geoip.dat" \
            "https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geoip.dat"

          download_file "DAVOYAN" "$DAVOYAN_INPUT" \
            "https://raw.githubusercontent.com/Davoyan/xray-routing/main/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/Davoyan/xray-routing@main/release/geoip.dat"

          # Kirill is part of the existing RU whitelist base. Fetch its actual
          # Release asset via the GitHub API and independent Release mirrors.
          # Do not substitute a nonexistent main/release/geoip.dat path.
          download_kirill_geoip

          download_file "GOLUKON" "$GOLUKON_INPUT" \
            "https://raw.githubusercontent.com/golukon/russia-only-geoip/release/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat" \
            "https://fastly.jsdelivr.net/gh/golukon/russia-only-geoip@release/geoip.dat"

          # v2fly publishes the full V2Ray GeoIP protobuf database and a SHA-256
          # sidecar. Verify the exact upstream bytes before importing only the RU entry.
          download_file "V2FLY GEOIP SHA256" "$V2FLY_SHA_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat.sha256sum" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat.sha256sum" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat.sha256sum"
          download_file "V2FLY GEOIP (RU CATEGORY ONLY)" "$V2FLY_INPUT" \
            "https://github.com/v2fly/geoip/releases/latest/download/geoip.dat" \
            "https://cdn.jsdelivr.net/gh/v2fly/geoip@release/geoip.dat" \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat"
          V2FLY_EXPECTED_SHA="$(awk 'NF {print $1; exit}' "$V2FLY_SHA_INPUT" | tr -d '\r')"
          if [[ ! "$V2FLY_EXPECTED_SHA" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Invalid v2fly geoip.dat.sha256sum format"
            exit 1
          fi
          V2FLY_ACTUAL_SHA="$(sha256sum "$V2FLY_INPUT" | awk '{print $1}')"
          if [[ "$V2FLY_ACTUAL_SHA" != "$V2FLY_EXPECTED_SHA" ]]; then
            echo "::error::v2fly geoip.dat SHA-256 mismatch: expected=$V2FLY_EXPECTED_SHA actual=$V2FLY_ACTUAL_SHA"
            exit 1
          fi
          echo "v2fly geoip.dat SHA-256 verified: $V2FLY_ACTUAL_SHA"

          download_file "LOYALSOLDIER RU (CORE SOURCE, NOT A MASK)" "$LOYALSOLDIER_RU_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/ru.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/ru.dat"

          download_file "LOYALSOLDIER PRIVATE" "$LOYALSOLDIER_PRIVATE_INPUT" \
            "https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://fastly.jsdelivr.net/gh/Loyalsoldier/geoip@release/dat/private.dat" \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/dat/private.dat"

          download_file "HXEHEX MOBILE WHITELIST" "$HXEHEX_INPUT" \
            "https://raw.githubusercontent.com/hxehex/russia-mobile-internet-whitelist/main/cidrwhitelist.txt" \
            "https://cdn.jsdelivr.net/gh/hxehex/russia-mobile-internet-whitelist@main/cidrwhitelist.txt"

          download_file "W1ZARDZ RU DIRECT IPV4" "$W1ZARDZ_INPUT" \
            "https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-ipv4.txt" \
            "https://cdn.jsdelivr.net/gh/w1zardz/amnezia-vpn-russia-split-tunneling@master/dist/ru-direct-ipv4.txt"

          echo "==============================================="
          echo "Downloading additive RU ASN/BGP data"
          echo "==============================================="

          # RIPEstat's Country Resource List is itself derived from RIR delegated
          # statistics. Avoid making the RIPEstat API a single point of failure:
          # fetch each RIR's authoritative daily file, with cross-RIR mirrors.
          echo "==============================================="
          echo "Downloading five RIR delegated statistics files"
          echo "==============================================="

          download_file "AFRINIC DELEGATED STATS" "$AFRINIC_STATS" \
            "https://ftp.afrinic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.apnic.net/pub/stats/afrinic/delegated-afrinic-latest" \
            "https://ftp.ripe.net/pub/stats/afrinic/delegated-afrinic-latest"

          download_file "APNIC DELEGATED STATS" "$APNIC_STATS" \
            "https://ftp.apnic.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.ripe.net/pub/stats/apnic/delegated-apnic-latest" \
            "https://ftp.afrinic.net/pub/stats/apnic/delegated-apnic-latest"

          download_file "ARIN DELEGATED STATS" "$ARIN_STATS" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.arin.net/pub/stats/arin/delegated-arin-latest" \
            "https://ftp.ripe.net/pub/stats/arin/delegated-arin-extended-latest" \
            "https://ftp.apnic.net/pub/stats/arin/delegated-arin-extended-latest"

          download_file "LACNIC DELEGATED STATS" "$LACNIC_STATS" \
            "https://ftp.lacnic.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.ripe.net/pub/stats/lacnic/delegated-lacnic-latest" \
            "https://ftp.apnic.net/pub/stats/lacnic/delegated-lacnic-latest"

          download_file "RIPE NCC DELEGATED STATS" "$RIPENCC_STATS" \
            "https://ftp.ripe.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.apnic.net/pub/stats/ripencc/delegated-ripencc-latest" \
            "https://ftp.afrinic.net/pub/stats/ripencc/delegated-ripencc-latest"

          # Official IANA Special-Purpose registries. IANA currently publishes the CSV
          # download under the numbered filename *-1.csv (not the registry-name.csv URL).
          # Non-globally-reachable entries
          # are included in PRIVATE; globally-reachable exceptions are subtracted back
          # out so broad special-purpose blocks do not swallow explicit exceptions.
          download_file "IANA IPV4 SPECIAL REGISTRY" "$IANA_V4_CSV" \
            "https://www.iana.org/assignments/iana-ipv4-special-registry/iana-ipv4-special-registry-1.csv"
          download_file "IANA IPV6 SPECIAL REGISTRY" "$IANA_V6_CSV" \
            "https://www.iana.org/assignments/iana-ipv6-special-registry/iana-ipv6-special-registry-1.csv"

          # Extract RU-registered ASNs AND RU-registered IPv4/IPv6 resources from
          # the five authoritative RIR delegated-stat snapshots. IP registration
          # country is a corroborating registry signal, not proof of server location.
          python3 - "$AFRINIC_STATS" "$APNIC_STATS" "$ARIN_STATS" \
            "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
            "$RIR_PREFIX_INPUT" "$RIR_STATS" <<'PY'
          import datetime
          import ipaddress
          import pathlib
          import sys

          inputs = [
              ("afrinic", pathlib.Path(sys.argv[1])),
              ("apnic", pathlib.Path(sys.argv[2])),
              ("arin", pathlib.Path(sys.argv[3])),
              ("lacnic", pathlib.Path(sys.argv[4])),
              ("ripencc", pathlib.Path(sys.argv[5])),
          ]
          asn_output = pathlib.Path(sys.argv[6])
          prefix_output = pathlib.Path(sys.argv[7])
          stats_output = pathlib.Path(sys.argv[8])
          asns = set()
          rir_prefixes = set()
          summaries = []
          today = datetime.date.today()
          raw_asn_records = raw_v4_records = raw_v6_records = 0

          def prefix_sort(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          for expected_registry, path in inputs:
              try:
                  lines = path.read_text(encoding="utf-8", errors="strict").splitlines()
              except (OSError, UnicodeError) as exc:
                  raise SystemExit(f"Cannot read {expected_registry} delegated stats: {exc}")
              if not lines:
                  raise SystemExit(f"Empty delegated stats file: {path}")

              header = None
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if (len(fields) >= 7 and (fields[0] == "2" or fields[0].startswith("2."))
                          and fields[1].lower() == expected_registry):
                      header = fields
                      break
              if header is None:
                  first_nonempty = next((line.strip() for line in lines if line.strip()), "<empty>")
                  raise SystemExit(
                      f"Invalid/mismatched {expected_registry} stats header in {path}; "
                      f"first non-empty line: {first_nonempty[:160]!r}"
                  )

              try:
                  snapshot_date = datetime.datetime.strptime(header[5], "%Y%m%d").date()
              except ValueError:
                  raise SystemExit(f"Invalid snapshot enddate in {expected_registry}: {header[5]!r}")
              age_days = (today - snapshot_date).days
              if age_days < -1 or age_days > 14:
                  raise SystemExit(
                      f"Stale/future {expected_registry} delegated stats: {snapshot_date} ({age_days} days old)"
                  )

              count_asn = count_v4 = count_v6 = 0
              for line in lines:
                  normalized = line.lstrip("\ufeff").strip()
                  if not normalized or normalized.startswith("#"):
                      continue
                  fields = [field.strip() for field in normalized.split("|")]
                  if len(fields) < 7:
                      continue
                  registry, country, resource_type, start, value, _date, status = fields[:7]
                  if registry.lower() != expected_registry or country.upper() != "RU":
                      continue
                  if status.lower() not in {"allocated", "assigned", "legacy"}:
                      continue

                  kind = resource_type.lower()
                  if kind == "asn":
                      try:
                          first, count = int(start), int(value)
                      except ValueError:
                          continue
                      if first < 1 or count < 1 or first + count - 1 > 4294967295:
                          continue
                      asns.update(range(first, first + count))
                      count_asn += 1
                      continue

                  if kind == "ipv4":
                      try:
                          first_ip = ipaddress.ip_address(start)
                          count = int(value)
                          if first_ip.version != 4 or count < 1:
                              continue
                          last_int = int(first_ip) + count - 1
                          if last_int > (1 << 32) - 1:
                              continue
                          last_ip = ipaddress.ip_address(last_int)
                          nets = ipaddress.summarize_address_range(first_ip, last_ip)
                          for net in nets:
                              if net.prefixlen == 0:
                                  continue
                              rir_prefixes.add(str(net))
                          count_v4 += 1
                      except (ValueError, TypeError):
                          continue
                      continue

                  if kind == "ipv6":
                      try:
                          prefixlen = int(value)
                          if not 0 < prefixlen <= 128:
                              continue
                          net = ipaddress.ip_network(f"{start}/{prefixlen}", strict=False)
                          if net.version != 6 or net.prefixlen == 0:
                              continue
                          rir_prefixes.add(str(net))
                          count_v6 += 1
                      except (ValueError, TypeError):
                          continue

              raw_asn_records += count_asn
              raw_v4_records += count_v4
              raw_v6_records += count_v6
              note = " (zero valid for an RIR with no RU records of this type)"
              summaries.append(
                  f"{expected_registry}: snapshot={snapshot_date}, ASN records={count_asn}, "
                  f"IPv4 records={count_v4}, IPv6 records={count_v6}{note}"
              )
              print(summaries[-1])

          if len(asns) < 25 or len(asns) > 100000:
              raise SystemExit(f"RIR ASN registry sanity check failed: {len(asns)} unique RU ASNs")
          if not rir_prefixes:
              raise SystemExit("RIR RU IPv4/IPv6 resource inventory is empty; refusing unverified build")

          with asn_output.open("w", encoding="utf-8") as handle:
              handle.write("# Unique RU ASNs from allocated, assigned and legacy records in five RIR delegated stats files\n")
              for asn in sorted(asns):
                  handle.write(f"AS{asn}\n")

          with prefix_output.open("w", encoding="utf-8") as handle:
              handle.write("# IPv4/IPv6 resources registered to RU in the five RIR delegated statistics files\n")
              handle.write("# Registration country is not proof of physical server location; used as corroboration only.\n")
              for prefix in sorted(rir_prefixes, key=prefix_sort):
                  handle.write(prefix + "\n")

          stats_lines = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"Unique RU-registered ASNs: {len(asns)}",
              f"Unique RU-registered IPv4/IPv6 CIDR: {len(rir_prefixes)}",
              f"RIR IPv4 records: {raw_v4_records}",
              f"RIR IPv6 records: {raw_v6_records}",
              f"RIR ASN records: {raw_asn_records}",
              "Caveat: RIR country describes registration, not physical hosting location.",
              *summaries,
          ]
          stats_output.write_text("\n".join(stats_lines) + "\n", encoding="utf-8")
          print("Unique RU-registered ASNs:", len(asns))
          print("Unique RU-registered address prefixes:", len(rir_prefixes))
          PY

          # Convert the official IANA registries into exact non-globally-reachable
          # prefixes and explicit globally-reachable exceptions.
          python3 - "$IANA_V4_CSV" "$IANA_V6_CSV" \
            "$IANA_PRIVATE_PREFIX_INPUT" "$IANA_REACHABLE_PREFIX_INPUT" <<'PY'
          import csv
          import ipaddress
          import pathlib
          import sys

          inputs = [pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])]
          private_out = pathlib.Path(sys.argv[3])
          reachable_out = pathlib.Path(sys.argv[4])
          non_global = set()
          global_exceptions = set()

          for path in inputs:
              try:
                  with path.open("r", encoding="utf-8-sig", newline="") as handle:
                      rows = list(csv.DictReader(handle))
              except (OSError, UnicodeError, csv.Error) as exc:
                  raise SystemExit(f"Cannot parse IANA registry {path}: {exc}")
              if not rows or "Address Block" not in rows[0] or "Globally Reachable" not in rows[0]:
                  raise SystemExit(f"Unexpected IANA CSV schema: {path}")
              for row in rows:
                  block = (row.get("Address Block") or "").strip()
                  reachable = (row.get("Globally Reachable") or "").strip().split()[0].lower() if (row.get("Globally Reachable") or "").strip() else ""
                  if not block or reachable not in {"true", "false"}:
                      continue
                  try:
                      net = ipaddress.ip_network(block, strict=False)
                  except ValueError:
                      continue
                  if net.prefixlen == 0:
                      continue
                  if reachable == "false":
                      non_global.add(str(net))
                  else:
                      global_exceptions.add(str(net))

          def key(value):
              net = ipaddress.ip_network(value)
              return net.version, int(net.network_address), net.prefixlen

          if len(non_global) < 20:
              raise SystemExit(f"IANA non-globally-reachable prefix count unexpectedly small: {len(non_global)}")

          private_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=False\n" +
              "\n".join(sorted(non_global, key=key)) + "\n", encoding="utf-8"
          )
          reachable_out.write_text(
              "# IANA Special-Purpose entries where Globally Reachable=True; carve-outs from broad special blocks\n" +
              "\n".join(sorted(global_exceptions, key=key)) + "\n", encoding="utf-8"
          )
          print(f"IANA non-global prefixes: {len(non_global)}")
          print(f"IANA global-reachable exception prefixes: {len(global_exceptions)}")
          PY

          download_file "IPVERSE ASN/BGP ARCHIVE" "$IPVERSE_BGP_ARCHIVE" \
            "https://codeload.github.com/ipverse/as-ip-blocks/tar.gz/refs/heads/master" \
            "https://github.com/ipverse/as-ip-blocks/releases/latest/download/as-ip-blocks.tar.gz"

          # Validate every required core source and the additive ASN/BGP inputs before parsing.
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" \
                      "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                      "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                      "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                      "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" \
                      "$IPVERSE_BGP_ARCHIVE" "$IANA_V4_CSV" "$IANA_V6_CSV"; do
            test -s "$file" || { echo "::error::Missing or empty required input: $file"; exit 1; }
          done
          test "$(wc -c < "$IPVERSE_BGP_ARCHIVE")" -gt 5000000
          gzip -t "$IPVERSE_BGP_ARCHIVE"
          for file in "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" "$GOLUKON_INPUT" "$V2FLY_INPUT" "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT"; do
            test "$(wc -c < "$file")" -gt 100 || { echo "::error::Unexpectedly small GeoIP source: $file"; exit 1; }
          done
          ls -lh "$HYDRA_INPUT" "$GRIMBIRD_INPUT" "$DIGNE_INPUT" "$DAVOYAN_INPUT" "$KIRILL_INPUT" \
                 "$GOLUKON_INPUT" "$V2FLY_INPUT" "$V2FLY_SHA_INPUT" \
                 "$LOYALSOLDIER_RU_INPUT" "$LOYALSOLDIER_PRIVATE_INPUT" \
                 "$HXEHEX_INPUT" "$W1ZARDZ_INPUT" "$AFRINIC_STATS" "$APNIC_STATS" \
                 "$ARIN_STATS" "$LACNIC_STATS" "$RIPENCC_STATS" "$RU_ASN_REGISTRY" "$IPVERSE_BGP_ARCHIVE" "$IANA_V4_CSV" "$IANA_V6_CSV"

      - name: Extract RU ASN prefixes and global ipverse BGP observation set
        shell: bash
        run: |
          set -euo pipefail

          cat > extract_ru_asn_prefixes.py <<'PY'
          import collections
          import datetime
          import ipaddress
          import json
          import sys
          import tarfile

          archive_path, registry_path, ru_prefixes_path, global_prefixes_path, manifest_path, stats_path = sys.argv[1:7]
          registered_ru_asns = set()
          with open(registry_path, encoding="utf-8") as source:
              for raw in source:
                  value = raw.strip().upper()
                  if not value or value.startswith("#"):
                      continue
                  try:
                      asn = int(value.removeprefix("AS"))
                  except ValueError:
                      continue
                  if 0 < asn <= 4294967295:
                      registered_ru_asns.add(asn)
          if len(registered_ru_asns) < 25:
              raise SystemExit(f"RIR ASN sanity check failed: only {len(registered_ru_asns)} RU ASNs")

          archive_json_files = malformed_json = invalid_prefixes = 0
          metadata_country_mismatch = collections.Counter()
          ru_prefix_origins = collections.defaultdict(set)
          global_prefixes = set()
          active_ru_asns = {}
          raw_ru_v4 = raw_ru_v6 = raw_global_v4 = raw_global_v6 = 0

          try:
              archive = tarfile.open(archive_path, mode="r:gz")
          except (tarfile.TarError, OSError) as exc:
              raise SystemExit(f"Invalid ipverse archive: {exc}")

          with archive:
              for member in archive:
                  if not member.isfile() or not member.name.endswith("aggregated.json"):
                      continue
                  stream = archive.extractfile(member)
                  if stream is None:
                      malformed_json += 1
                      continue
                  try:
                      item = json.load(stream)
                  except (json.JSONDecodeError, UnicodeDecodeError):
                      malformed_json += 1
                      continue
                  archive_json_files += 1
                  try:
                      asn = int(item.get("asn"))
                  except (TypeError, ValueError):
                      continue

                  metadata = item.get("metadata") or {}
                  prefixes = item.get("prefixes") or {}
                  is_ru_asn = asn in registered_ru_asns
                  country_code = str(metadata.get("countryCode") or "UNKNOWN").upper()
                  if is_ru_asn and country_code != "RU":
                      metadata_country_mismatch[country_code] += 1
                  if is_ru_asn:
                      row = active_ru_asns.setdefault(asn, {
                          "handle": str(metadata.get("handle") or "-").replace("\t", " ").replace("\n", " "),
                          "description": str(metadata.get("description") or "-").replace("\t", " ").replace("\n", " "),
                          "ipverse_country": country_code,
                          "ipv4": 0,
                          "ipv6": 0,
                      })

                  for family, version in (("ipv4", 4), ("ipv6", 6)):
                      for raw_prefix in prefixes.get(family, []) or []:
                          try:
                              network = ipaddress.ip_network(str(raw_prefix), strict=False)
                              if network.version != version or network.prefixlen == 0:
                                  invalid_prefixes += 1
                                  continue
                          except ValueError:
                              invalid_prefixes += 1
                              continue
                          global_prefixes.add(str(network))
                          if version == 4:
                              raw_global_v4 += 1
                          else:
                              raw_global_v6 += 1
                          if is_ru_asn:
                              ru_prefix_origins[str(network)].add(asn)
                              row[family] += 1
                              if version == 4:
                                  raw_ru_v4 += 1
                              else:
                                  raw_ru_v6 += 1

          active_ru_asns = {asn: row for asn, row in active_ru_asns.items() if row["ipv4"] + row["ipv6"] > 0}
          if archive_json_files < 10000:
              raise SystemExit(f"ipverse sanity check failed: only {archive_json_files} aggregated.json files")
          if malformed_json:
              raise SystemExit(f"ipverse archive contains {malformed_json} malformed JSON files; refusing partial data")
          if len(active_ru_asns) < 25 or not ru_prefix_origins:
              raise SystemExit(f"Too few RU ASNs with BGP data: ASNs={len(active_ru_asns)}, prefixes={len(ru_prefix_origins)}")
          if len(global_prefixes) < 10000:
              raise SystemExit(f"Global ipverse prefix set unexpectedly small: {len(global_prefixes)}")

          def sort_key(value):
              network = ipaddress.ip_network(value)
              return network.version, int(network.network_address), network.prefixlen

          with open(ru_prefixes_path, "w", encoding="utf-8") as output:
              output.write("# Prefixes originated by ASNs registered to RU in five RIR delegated-stat files\n")
              for prefix in sorted(ru_prefix_origins, key=sort_key):
                  origins = ",".join(f"AS{asn}" for asn in sorted(ru_prefix_origins[prefix]))
                  output.write(f"{prefix} # {origins}\n")

          with open(global_prefixes_path, "w", encoding="utf-8") as output:
              output.write("# Union of prefixes in ipverse/as-ip-blocks aggregated.json files\n")
              output.write("# Observation window is up to 90 days; absence here is NOT proof of global unroutability.\n")
              for prefix in sorted(global_prefixes, key=sort_key):
                  output.write(prefix + "\n")

          with open(manifest_path, "w", encoding="utf-8") as output:
              output.write("ASN\tHANDLE\tDESCRIPTION\tRIR_REGISTRY_COUNTRY\tIPVERSE_COUNTRY_CODE\tIPV4_PREFIXES\tIPV6_PREFIXES\n")
              for asn in sorted(active_ru_asns):
                  row = active_ru_asns[asn]
                  output.write(f"AS{asn}\t{row['handle']}\t{row['description']}\tRU\t{row['ipverse_country']}\t{row['ipv4']}\t{row['ipv6']}\n")

          stats = [
              f"Generated UTC: {datetime.datetime.now(datetime.timezone.utc).isoformat()}",
              f"ipverse aggregated.json files: {archive_json_files}",
              f"RIR delegated-stats registered RU ASNs: {len(registered_ru_asns)}",
              f"RU-registered ASNs with ipverse BGP data: {len(active_ru_asns)}",
              f"Unique RU-origin prefixes: {len(ru_prefix_origins)}",
              f"Raw RU-origin IPv4 prefix records: {raw_ru_v4}",
              f"Raw RU-origin IPv6 prefix records: {raw_ru_v6}",
              f"Unique global ipverse prefixes: {len(global_prefixes)}",
              f"Raw global IPv4 prefix records: {raw_global_v4}",
              f"Raw global IPv6 prefix records: {raw_global_v6}",
              f"Prefixes originated by multiple RU ASNs: {sum(1 for values in ru_prefix_origins.values() if len(values) > 1)}",
              f"Invalid/default prefixes skipped: {invalid_prefixes}",
              "ipverse dataset caveat: ASes with announcements observed within the preceding 90 days; not a real-time RIB snapshot.",
              "ipverse countryCode mismatches (audit only): " + (", ".join(f"{key}={value}" for key, value in sorted(metadata_country_mismatch.items())) or "none"),
          ]
          with open(stats_path, "w", encoding="utf-8") as output:
              output.write("\n".join(stats) + "\n")
          print("=== RU ASN and global ipverse BGP extraction ===")
          print("\n".join(stats))
          PY

          python3 extract_ru_asn_prefixes.py "$IPVERSE_BGP_ARCHIVE" "$RU_ASN_REGISTRY" \
            "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" "$ASN_MANIFEST" "$ASN_STATS"
          for file in "$RU_PREFIX_INPUT" "$GLOBAL_BGP_PREFIX_INPUT" "$ASN_MANIFEST" "$ASN_STATS"; do
            test -s "$file" || { echo "::error::Missing BGP artifact: $file"; exit 1; }
          done

      - name: Build GeoIP RU v30 with trusted sources and quality gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p geoip-builder
          cat > geoip-builder/main.go <<'GO'
          package main
          
          import (
          	"bufio"
          	"fmt"
          	"math/big"
          	"net/netip"
          	"os"
          	"sort"
          	"strings"
          
          	router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          	"google.golang.org/protobuf/proto"
          )
          
          type sourceFile struct {
          	Name string
          	Path string
          	Kind string
          }
          
          type trieNode struct {
          	covered bool
          	child   [2]*trieNode
          }
          
          type ipTrie struct {
          	v4 *trieNode
          	v6 *trieNode
          }
          
          func newIPTrie() *ipTrie                { return &ipTrie{v4: &trieNode{}, v6: &trieNode{}} }
          func normalizeName(value string) string { return strings.ToLower(strings.TrimSpace(value)) }
          
          func getBit(addr netip.Addr, pos int) int {
          	if addr.Is4() {
          		b := addr.As4()
          		return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          	}
          	b := addr.As16()
          	return int((b[pos/8] >> (7 - (pos % 8))) & 1)
          }
          
          func setBit(addr netip.Addr, pos int) netip.Addr {
          	if addr.Is4() {
          		b := addr.As4()
          		b[pos/8] |= 1 << (7 - (pos % 8))
          		return netip.AddrFrom4(b)
          	}
          	b := addr.As16()
          	b[pos/8] |= 1 << (7 - (pos % 8))
          	return netip.AddrFrom16(b)
          }
          
          func (t *ipTrie) insert(prefix netip.Prefix) {
          	prefix = prefix.Masked()
          	addr, bits := prefix.Addr(), prefix.Bits()
          	curr := t.v6
          	if addr.Is4() {
          		curr = t.v4
          	}
          	for i := 0; i < bits; i++ {
          		if curr.covered {
          			return
          		}
          		bit := getBit(addr, i)
          		if curr.child[bit] == nil {
          			curr.child[bit] = &trieNode{}
          		}
          		curr = curr.child[bit]
          	}
          	curr.covered = true
          	curr.child[0], curr.child[1] = nil, nil
          }
          
          func compressNode(n *trieNode) bool {
          	if n == nil {
          		return false
          	}
          	if n.covered {
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	if !compressNode(n.child[0]) {
          		n.child[0] = nil
          	}
          	if !compressNode(n.child[1]) {
          		n.child[1] = nil
          	}
          	if n.child[0] != nil && n.child[0].covered && n.child[1] != nil && n.child[1].covered {
          		n.covered = true
          		n.child[0], n.child[1] = nil, nil
          		return true
          	}
          	return n.child[0] != nil || n.child[1] != nil
          }
          
          func (t *ipTrie) compress() {
          	if !compressNode(t.v4) {
          		t.v4 = &trieNode{}
          	}
          	if !compressNode(t.v6) {
          		t.v6 = &trieNode{}
          	}
          }
          
          func cloneNode(n *trieNode) *trieNode {
          	if n == nil {
          		return nil
          	}
          	copyNode := &trieNode{covered: n.covered}
          	copyNode.child[0], copyNode.child[1] = cloneNode(n.child[0]), cloneNode(n.child[1])
          	return copyNode
          }
          
          func cloneTrie(source *ipTrie) *ipTrie {
          	return &ipTrie{v4: cloneNode(source.v4), v6: cloneNode(source.v6)}
          }
          
          func intersectNode(target, mask *trieNode) *trieNode {
          	if target == nil || mask == nil {
          		return nil
          	}
          	if mask.covered {
          		return cloneNode(target)
          	}
          	if target.covered {
          		target = &trieNode{child: [2]*trieNode{{covered: true}, {covered: true}}}
          	}
          	out := &trieNode{}
          	for bit := 0; bit < 2; bit++ {
          		out.child[bit] = intersectNode(target.child[bit], mask.child[bit])
          	}
          	if out.child[0] == nil && out.child[1] == nil {
          		return nil
          	}
          	if out.child[0] != nil && out.child[0].covered && out.child[1] != nil && out.child[1].covered {
          		return &trieNode{covered: true}
          	}
          	return out
          }
          
          func (t *ipTrie) intersect(mask *ipTrie) {
          	t.v4, t.v6 = intersectNode(t.v4, mask.v4), intersectNode(t.v6, mask.v6)
          	if t.v4 == nil {
          		t.v4 = &trieNode{}
          	}
          	if t.v6 == nil {
          		t.v6 = &trieNode{}
          	}
          	t.compress()
          }
          
          func subtractNode(target, mask *trieNode) {
          	if target == nil || mask == nil {
          		return
          	}
          	if mask.covered {
          		target.covered = false
          		target.child[0], target.child[1] = nil, nil
          		return
          	}
          	if target.covered {
          		target.covered = false
          		target.child[0], target.child[1] = &trieNode{covered: true}, &trieNode{covered: true}
          	}
          	if mask.child[0] != nil && target.child[0] != nil {
          		subtractNode(target.child[0], mask.child[0])
          	}
          	if mask.child[1] != nil && target.child[1] != nil {
          		subtractNode(target.child[1], mask.child[1])
          	}
          }
          
          func (t *ipTrie) subtract(mask *ipTrie) {
          	subtractNode(t.v4, mask.v4)
          	subtractNode(t.v6, mask.v6)
          	t.compress()
          }
          
          func extractPrefixes(n *trieNode, addr netip.Addr, depth, bitLen int, out *[]netip.Prefix) {
          	if n == nil {
          		return
          	}
          	if n.covered {
          		*out = append(*out, netip.PrefixFrom(addr, depth).Masked())
          		return
          	}
          	if depth >= bitLen {
          		return
          	}
          	if n.child[0] != nil {
          		extractPrefixes(n.child[0], addr, depth+1, bitLen, out)
          	}
          	if n.child[1] != nil {
          		extractPrefixes(n.child[1], setBit(addr, depth), depth+1, bitLen, out)
          	}
          }
          
          func (t *ipTrie) toPrefixes() []netip.Prefix {
          	var out []netip.Prefix
          	extractPrefixes(t.v4, netip.IPv4Unspecified(), 0, 32, &out)
          	extractPrefixes(t.v6, netip.IPv6Unspecified(), 0, 128, &out)
          	return out
          }
          
          func unionInto(dst, src *ipTrie) {
          	for _, prefix := range src.toPrefixes() {
          		dst.insert(prefix)
          	}
          	dst.compress()
          }
          
          func isBlockedCategory(category string) bool {
          	category = normalizeName(category)
          	for _, token := range []string{"blocked", "blacklist", "deny", "antifilter", "re-filter"} {
          		if strings.Contains(category, token) {
          			return true
          		}
          	}
          	return false
          }
          
          // Direct/whitelist entries are audit signals only; they never subtract GeoIP data.
          func targetCategory(source, category string) string {
          	source, category = normalizeName(source), normalizeName(category)
          	if isBlockedCategory(category) {
          		return ""
          	}
          	if category == "private" {
          		if source == "loyalsoldier-private" {
          			return "private"
          		}
          		return ""
          	}
          	switch source {
          	case "hydra":
          		// Upstream roscomvpn-geoip publishes direct, whitelist and private,
          		// not a strict geoip:ru category. direct/whitelist include RU/BY, CDN
          		// and foreign infrastructure, so treat these entries as diagnostic
          		// candidates only; never admit them as geographic RU on their own.
          		if category == "direct" || category == "whitelist" {
          			return "candidate"
          		}
          	case "grimbird":
          		if category == "ru" {
          			return "ru"
          		}
          		if strings.HasPrefix(category, "ru-") {
          			if strings.Contains(category, "direct") || strings.Contains(category, "whitelist") || strings.Contains(category, "wl-") {
          				return "candidate"
          			}
          			return "ru"
          		}
          	case "digne":
          		if category == "ru" || category == "ru-ip" {
          			return "ru"
          		}
          		if category == "direct-ip" || category == "whitelist" {
          			return "candidate"
          		}
          	case "davoyan":
          		if category == "ru" {
          			return "ru"
          		}
          		if category == "wl-ru" {
          			return "candidate"
          		}
          	case "kirill":
          		if category == "whitelist" {
          			return "candidate"
          		}
          	case "golukon", "loyalsoldier", "v2fly":
          		if category == "ru" {
          			return "ru"
          		}
          	}
          	return ""
          }
          
          func cidrPrefix(cidr *router.CIDR) (netip.Prefix, bool) {
          	if cidr == nil || cidr.Prefix > 128 {
          		return netip.Prefix{}, false
          	}
          	var addr netip.Addr
          	switch len(cidr.Ip) {
          	case 4:
          		var b [4]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom4(b)
          	case 16:
          		var b [16]byte
          		copy(b[:], cidr.Ip)
          		addr = netip.AddrFrom16(b)
          	default:
          		return netip.Prefix{}, false
          	}
          	if int(cidr.Prefix) > addr.BitLen() {
          		return netip.Prefix{}, false
          	}
          	return netip.PrefixFrom(addr, int(cidr.Prefix)).Masked(), true
          }
          
          func loadGeoIP(path string) (*router.GeoIPList, error) {
          	data, err := os.ReadFile(path)
          	if err != nil {
          		return nil, err
          	}
          	if len(data) == 0 {
          		return nil, fmt.Errorf("empty GeoIP file: %s", path)
          	}
          	list := new(router.GeoIPList)
          	if err := proto.Unmarshal(data, list); err != nil {
          		return nil, fmt.Errorf("invalid GeoIP %s: %w", path, err)
          	}
          	return list, nil
          }
          
          func loadGeoIPSource(source sourceFile, coreRU, candidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU *ipTrie, additional map[string]*ipTrie) (ruCount, candidateCount, privateCount int, err error) {
          	list, err := loadGeoIP(source.Path)
          	if err != nil {
          		return 0, 0, 0, err
          	}
          	for _, entry := range list.Entry {
          		if entry == nil {
          			continue
          		}
          		target := targetCategory(source.Name, entry.CountryCode)
          		if target == "" {
          			continue
          		}
          		for _, cidr := range entry.Cidr {
          			prefix, ok := cidrPrefix(cidr)
          			if !ok || prefix.Bits() == 0 {
          				continue
          			}
          			switch target {
          			case "private":
          				privateTrie.insert(prefix)
          				privateCount++
          			case "candidate":
          				candidates.insert(prefix)
          				candidateCount++
          			case "ru":
          				coreRU.insert(prefix)
          				ruCount++
          				if source.Name == "loyalsoldier" {
          					protectedLoyalsoldierRU.insert(prefix)
          				}
          				if source.Name == "v2fly" {
          					protectedV2FlyRU.insert(prefix)
          				}
          				if dst := additional[source.Name]; dst != nil {
          					dst.insert(prefix)
          				}
          			}
          		}
          	}
          	return ruCount, candidateCount, privateCount, nil
          }
          
          func loadTextPrefixes(trie *ipTrie, path string) (int, error) {
          	file, err := os.Open(path)
          	if err != nil {
          		return 0, err
          	}
          	defer file.Close()
          	added := 0
          	scanner := bufio.NewScanner(file)
          	scanner.Buffer(make([]byte, 64*1024), 4*1024*1024)
          	for scanner.Scan() {
          		line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
          		if line == "" || strings.HasPrefix(line, "#") {
          			continue
          		}
          		if idx := strings.IndexByte(line, '#'); idx >= 0 {
          			line = strings.TrimSpace(line[:idx])
          		}
          		upper := strings.ToUpper(line)
          		for _, prefix := range []string{"IP-CIDR,", "IP-CIDR6,", "IPSET,", "CIDR,"} {
          			if strings.HasPrefix(upper, prefix) {
          				line = strings.TrimSpace(line[len(prefix):])
          				break
          			}
          		}
          		fields := strings.FieldsFunc(line, func(r rune) bool { return r == ' ' || r == '\t' || r == ',' || r == ';' })
          		for _, field := range fields {
          			field = strings.Trim(field, "[](){}\"'")
          			if field == "" {
          				continue
          			}
          			if prefix, parseErr := netip.ParsePrefix(field); parseErr == nil {
          				if prefix.Bits() == 0 {
          					continue
          				}
          				trie.insert(prefix)
          				added++
          				break
          			}
          			if addr, parseErr := netip.ParseAddr(field); parseErr == nil {
          				trie.insert(netip.PrefixFrom(addr, addr.BitLen()).Masked())
          				added++
          				break
          			}
          		}
          	}
          	if err := scanner.Err(); err != nil {
          		return added, err
          	}
          	return added, nil
          }
          
          // Explicit local-use/reserved networks supplemented by the current IANA
          // Special-Purpose registry's Globally Reachable=False entries.
          func insertBuiltInPrivate(t *ipTrie) {
          	for _, value := range []string{
          		"0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8",
          		"169.254.0.0/16", "172.16.0.0/12", "192.0.2.0/24", "192.168.0.0/16",
          		"198.18.0.0/15", "198.51.100.0/24", "203.0.113.0/24", "224.0.0.0/4", "240.0.0.0/4",
          		"::/128", "::1/128", "fc00::/7", "fe80::/10", "ff00::/8", "2001:db8::/32",
          	} {
          		if p, err := netip.ParsePrefix(value); err == nil {
          			t.insert(p)
          		}
          	}
          }
          
          func sortPrefixes(prefixes []netip.Prefix) {
          	sort.Slice(prefixes, func(i, j int) bool {
          		if prefixes[i].Addr().BitLen() != prefixes[j].Addr().BitLen() {
          			return prefixes[i].Addr().BitLen() < prefixes[j].Addr().BitLen()
          		}
          		if cmp := prefixes[i].Addr().Compare(prefixes[j].Addr()); cmp != 0 {
          			return cmp < 0
          		}
          		return prefixes[i].Bits() < prefixes[j].Bits()
          	})
          }
          
          func countAddressSpace(prefixes []netip.Prefix, bitLen int) *big.Int {
          	total := new(big.Int)
          	for _, prefix := range prefixes {
          		if prefix.Addr().BitLen() != bitLen {
          			continue
          		}
          		count := new(big.Int).Lsh(big.NewInt(1), uint(bitLen-prefix.Bits()))
          		total.Add(total, count)
          	}
          	return total
          }
          
          func setStats(set *ipTrie) (int, string, string) {
          	copySet := cloneTrie(set)
          	copySet.compress()
          	prefixes := copySet.toPrefixes()
          	return len(prefixes), countAddressSpace(prefixes, 32).String(), countAddressSpace(prefixes, 128).String()
          }
          
          func statsLine(label string, set *ipTrie) string {
          	count, v4, v6 := setStats(set)
          	return fmt.Sprintf("%s: CIDR=%d IPv4=%s IPv6=%s", label, count, v4, v6)
          }
          
          func writeOutput(priv, ru []netip.Prefix, path string) ([]byte, error) {
          	result := new(router.GeoIPList)
          	for _, target := range []struct {
          		name     string
          		prefixes []netip.Prefix
          	}{{"PRIVATE", priv}, {"RU", ru}} {
          		if len(target.prefixes) == 0 {
          			continue
          		}
          		entry := &router.GeoIP{CountryCode: target.name}
          		for _, prefix := range target.prefixes {
          			if prefix.Addr().Is4() {
          				a := prefix.Addr().As4()
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: []byte{a[0], a[1], a[2], a[3]}, Prefix: uint32(prefix.Bits())})
          			} else {
          				a := prefix.Addr().As16()
          				ip := make([]byte, 16)
          				copy(ip, a[:])
          				entry.Cidr = append(entry.Cidr, &router.CIDR{Ip: ip, Prefix: uint32(prefix.Bits())})
          			}
          		}
          		result.Entry = append(result.Entry, entry)
          	}
          	data, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
          	if err != nil {
          		return nil, err
          	}
          	return data, os.WriteFile(path, data, 0644)
          }
          
          func writeCategories(path string, privateCount, ruCount int) error {
          	return os.WriteFile(path, []byte(fmt.Sprintf("RU\t%d\nPRIVATE\t%d\n", ruCount, privateCount)), 0644)
          }
          
          func writeSourceCounts(path string, counts map[string]int) error {
          	order := []string{"hydra", "grimbird", "digne", "davoyan", "golukon", "loyalsoldier", "v2fly", "loyalsoldier-private", "kirill", "hxehex-whitelist", "w1zardz-ru", "ru-asn-bgp", "rir-ru", "global-bgp", "iana-non-global", "iana-global-exceptions"}
          	var b strings.Builder
          	b.WriteString("SOURCE\tPARSED_CIDR_INPUTS\n")
          	for _, name := range order {
          		fmt.Fprintf(&b, "%s\t%d\n", name, counts[name])
          	}
          	return os.WriteFile(path, []byte(b.String()), 0644)
          }
          
          func writeQualityReport(path string, lines []string) error {
          	content := "GeoIP Russia CLIENT v30 Quality Report\nGenerated by the Go builder; all coverage counts are exact address-space sums of disjoint trie prefixes.\n\n" + strings.Join(lines, "\n") + "\n"
          	return os.WriteFile(path, []byte(content), 0644)
          }
          
          func main() {
          	if len(os.Args) != 22 {
          		fmt.Fprintf(os.Stderr, "usage: %s <hydra> <grimbird> <digne> <davoyan> <kirill> <golukon> <v2fly> <loyalsoldier-ru> <loyalsoldier-private> <hxehex> <w1zardz> <ru-asn-bgp> <rir-ru> <global-bgp> <iana-non-global> <iana-global-exceptions> <output> <categories> <sources> <source-counts> <quality-report>\n", os.Args[0])
          		os.Exit(2)
          	}
          	files := []sourceFile{
          		{"hydra", os.Args[1], "dat"}, {"grimbird", os.Args[2], "dat"}, {"digne", os.Args[3], "dat"},
          		{"davoyan", os.Args[4], "dat"}, {"kirill", os.Args[5], "dat"}, {"golukon", os.Args[6], "dat"},
          		{"v2fly", os.Args[7], "dat"}, {"loyalsoldier", os.Args[8], "dat"}, {"loyalsoldier-private", os.Args[9], "dat"},
          		{"hxehex-whitelist", os.Args[10], "text"}, {"w1zardz-ru", os.Args[11], "text"},
          		{"ru-asn-bgp", os.Args[12], "text"}, {"rir-ru", os.Args[13], "text"}, {"global-bgp", os.Args[14], "text"},
          	}
          	ianaPrivatePath, ianaExceptionsPath := os.Args[15], os.Args[16]
          	outputPath, categoryPath, sourcePath, countsPath, qualityPath := os.Args[17], os.Args[18], os.Args[19], os.Args[20], os.Args[21]
          
          	coreRU, candidates, asnRU, rirRU, globalBGP, privateTrie := newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie(), newIPTrie()
          	protectedLoyalsoldierRU, protectedV2FlyRU := newIPTrie(), newIPTrie()
          	additional := map[string]*ipTrie{}
          	for _, name := range []string{"grimbird", "digne", "davoyan", "golukon"} {
          		additional[name] = newIPTrie()
          	}
          	insertBuiltInPrivate(privateTrie)
          	counts := make(map[string]int)
          	candidateRaw, coreRaw, bgpRaw, rirRaw, globalRaw := 0, 0, 0, 0, 0
          
          	for _, source := range files {
          		if source.Kind == "dat" {
          			ruCount, candidateCount, privateCount, err := loadGeoIPSource(source, coreRU, candidates, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU, additional)
          			if err != nil {
          				panic(fmt.Errorf("%s: %w", source.Name, err))
          			}
          			counts[source.Name] = ruCount + candidateCount + privateCount
          			if source.Name == "loyalsoldier-private" {
          				if privateCount == 0 {
          					panic("Loyalsoldier private.dat has no PRIVATE CIDRs")
          				}
          				continue
          			}
          			if source.Name == "kirill" {
          				candidateRaw += candidateCount
          				continue
          			}
          			if source.Name == "hydra" && candidateCount == 0 {
          				panic("Hydra direct/whitelist input contains no candidate CIDRs; refusing silent source loss")
          			}
          			if source.Name == "grimbird" || source.Name == "digne" || source.Name == "davoyan" || source.Name == "golukon" || source.Name == "loyalsoldier" || source.Name == "v2fly" {
          				if ruCount == 0 {
          					panic(fmt.Errorf("source %s has no accepted RU CIDRs; refusing silent source loss", source.Name))
          				}
          			}
          			candidateRaw += candidateCount
          			coreRaw += ruCount
          			fmt.Printf("Loaded %-20s RU=%d candidates=%d private=%d\n", source.Name, ruCount, candidateCount, privateCount)
          			continue
          		}
          
          		target := candidates
          		switch source.Name {
          		case "ru-asn-bgp":
          			target = asnRU
          		case "rir-ru":
          			target = rirRU
          		case "global-bgp":
          			target = globalBGP
          		}
          		matched, err := loadTextPrefixes(target, source.Path)
          		if err != nil {
          			panic(fmt.Errorf("%s: %w", source.Name, err))
          		}
          		counts[source.Name] = matched
          		switch source.Name {
          		case "ru-asn-bgp":
          			bgpRaw = matched
          		case "rir-ru":
          			rirRaw = matched
          		case "global-bgp":
          			globalRaw = matched
          		default:
          			candidateRaw += matched
          		}
          		if matched == 0 {
          			panic(fmt.Errorf("source %s parsed zero prefixes; refusing incomplete build", source.Name))
          		}
          		fmt.Printf("Loaded %-20s CIDRs=%d\n", source.Name, matched)
          	}
          
          	ianaPrivateCount, err := loadTextPrefixes(privateTrie, ianaPrivatePath)
          	if err != nil {
          		panic(fmt.Errorf("IANA non-global registry: %w", err))
          	}
          	counts["iana-non-global"] = ianaPrivateCount
          	if ianaPrivateCount < 20 {
          		panic(fmt.Errorf("IANA non-global registry unexpectedly small: %d", ianaPrivateCount))
          	}
          	ianaExceptions := newIPTrie()
          	ianaExceptionCount, err := loadTextPrefixes(ianaExceptions, ianaExceptionsPath)
          	if err != nil {
          		panic(fmt.Errorf("IANA globally-reachable exceptions: %w", err))
          	}
          	counts["iana-global-exceptions"] = ianaExceptionCount
          	if ianaExceptionCount == 0 {
          		panic("IANA global-reachable exception list is empty; refusing ambiguous PRIVATE policy")
          	}
          	// Specific globally-reachable exceptions override broad special-purpose parent blocks.
          	privateTrie.subtract(ianaExceptions)
          
          	for _, trie := range []*ipTrie{coreRU, candidates, asnRU, rirRU, globalBGP, privateTrie, protectedLoyalsoldierRU, protectedV2FlyRU} {
          		trie.compress()
          	}
          	for _, trie := range additional {
          		trie.compress()
          	}
          	if len(protectedLoyalsoldierRU.toPrefixes()) == 0 {
          		panic("Loyalsoldier geoip:ru is empty")
          	}
          	if len(protectedV2FlyRU.toPrefixes()) == 0 {
          		panic("v2fly geoip:ru is empty")
          	}
          	if len(asnRU.toPrefixes()) == 0 {
          		panic("RU ASN/BGP is empty")
          	}
          	if len(rirRU.toPrefixes()) == 0 {
          		panic("RIR RU allocation inventory is empty")
          	}
          	if len(globalBGP.toPrefixes()) == 0 {
          		panic("global ipverse BGP observation set is empty")
          	}
          
          	// Trusted RU geographic layers: retain their address space, except for the
          	// explicitly higher-priority PRIVATE set.
          	trustedGeo := cloneTrie(protectedLoyalsoldierRU)
          	unionInto(trustedGeo, protectedV2FlyRU)
          	trustedPublic := cloneTrie(trustedGeo)
          	trustedPublic.subtract(privateTrie)
          
          	// Additional feeds are admitted only where corroborated by at least two
          	// distinct named RU GeoIP feeds, or by RU-origin BGP, or by RIR-RU allocation.
          	additionalUnion := newIPTrie()
          	extraNames := []string{"grimbird", "digne", "davoyan", "golukon"}
          	for _, name := range extraNames {
          		unionInto(additionalUnion, additional[name])
          	}
          	additionalTwoSources := newIPTrie()
          	for i := 0; i < len(extraNames); i++ {
          		for j := i + 1; j < len(extraNames); j++ {
          			pair := cloneTrie(additional[extraNames[i]])
          			pair.intersect(additional[extraNames[j]])
          			unionInto(additionalTwoSources, pair)
          		}
          	}
          	additionalWithRUBGP := cloneTrie(additionalUnion)
          	additionalWithRUBGP.intersect(asnRU)
          	additionalWithRUBGP.subtract(privateTrie)
          	additionalWithRIRRU := cloneTrie(additionalUnion)
          	additionalWithRIRRU.intersect(rirRU)
          	additionalWithRIRRU.subtract(privateTrie)
          	additionalTwoSources.subtract(privateTrie)
          	eligibleAdditional := cloneTrie(additionalTwoSources)
          	unionInto(eligibleAdditional, additionalWithRUBGP)
          	unionInto(eligibleAdditional, additionalWithRIRRU)
          	eligibleAdditional.subtract(trustedGeo)
          	eligibleAdditional.compress()
          
          	acceptedAdditionalEvidence := cloneTrie(eligibleAdditional)
          	unconfirmedAdditional := cloneTrie(additionalUnion)
          	unconfirmedAdditional.subtract(trustedGeo)
          	unconfirmedAdditional.subtract(acceptedAdditionalEvidence)
          	unconfirmedAdditional.subtract(privateTrie)
          	unconfirmedAdditional.compress()
          
          	// Candidate lists do not carve out geo ranges. They are diagnostic signals;
          	// candidate ranges already included by RU-origin BGP remain included via BGP.
          	candidateOnRUBGP := cloneTrie(candidates)
          	candidateOnRUBGP.intersect(asnRU)
          	candidateOnRUBGP.subtract(privateTrie)
          	candidateOnRIR := cloneTrie(candidates)
          	candidateOnRIR.intersect(rirRU)
          	candidateOnRIR.subtract(privateTrie)
          	candidateOnTrusted := cloneTrie(candidates)
          	candidateOnTrusted.intersect(trustedGeo)
          	candidateOnTrusted.subtract(privateTrie)
          
          	// RU-registered ASN announcements are included as an explicit additive layer.
          	beforeBGP := cloneTrie(trustedGeo)
          	unionInto(beforeBGP, eligibleAdditional)
          	beforeBGP.subtract(privateTrie)
          	finalRU := cloneTrie(beforeBGP)
          	unionInto(finalRU, asnRU)
          	finalRU.subtract(privateTrie)
          	finalRU.compress()
          	privateTrie.compress()
          
          	// Protected-source invariants after PRIVATE policy. These compare address
          	// coverage as sets, not literal CIDR strings.
          	lostLoyalsoldier := cloneTrie(protectedLoyalsoldierRU)
          	lostLoyalsoldier.subtract(privateTrie)
          	checkLoyalsoldier := cloneTrie(lostLoyalsoldier)
          	checkLoyalsoldier.subtract(finalRU)
          	if lost := checkLoyalsoldier.toPrefixes(); len(lost) > 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("Loyalsoldier public coverage lost after PRIVATE: %d prefixes; first=%s", len(lost), lost[0]))
          	}
          	lostV2Fly := cloneTrie(protectedV2FlyRU)
          	lostV2Fly.subtract(privateTrie)
          	checkV2Fly := cloneTrie(lostV2Fly)
          	checkV2Fly.subtract(finalRU)
          	if lost := checkV2Fly.toPrefixes(); len(lost) > 0 {
          		sortPrefixes(lost)
          		panic(fmt.Errorf("v2fly public coverage lost after PRIVATE: %d prefixes; first=%s", len(lost), lost[0]))
          	}
          	privateOverlap := cloneTrie(finalRU)
          	privateOverlap.intersect(privateTrie)
          	if overlap := privateOverlap.toPrefixes(); len(overlap) > 0 {
          		panic(fmt.Errorf("PRIVATE/RU overlap invariant failed: %d prefixes", len(overlap)))
          	}
          
          	if len(finalRU.toPrefixes()) == 0 {
          		panic("final RU category is empty")
          	}
          	if len(privateTrie.toPrefixes()) == 0 {
          		panic("final PRIVATE category is empty")
          	}
          
          	// Global BGP audit is observation-only. ipverse contains AS data with
          	// announcements seen in its preceding 90-day window, not a real-time RIB.
          	observedGlobal := cloneTrie(finalRU)
          	observedGlobal.intersect(globalBGP)
          	notObservedGlobal := cloneTrie(finalRU)
          	notObservedGlobal.subtract(globalBGP)
          	finalInRUASN := cloneTrie(finalRU)
          	finalInRUASN.intersect(asnRU)
          	finalInRIR := cloneTrie(finalRU)
          	finalInRIR.intersect(rirRU)
          	finalTrusted := cloneTrie(finalRU)
          	finalTrusted.intersect(trustedGeo)
          
          	newBGP := cloneTrie(finalRU)
          	newBGP.subtract(beforeBGP)
          	privatePrefixes, ruPrefixes := privateTrie.toPrefixes(), finalRU.toPrefixes()
          	sortPrefixes(privatePrefixes)
          	sortPrefixes(ruPrefixes)
          	ipv4Count := countAddressSpace(ruPrefixes, 32).String()
          	ipv6Count := countAddressSpace(ruPrefixes, 128).String()
          	data, err := writeOutput(privatePrefixes, ruPrefixes, outputPath)
          	if err != nil {
          		panic(fmt.Errorf("write GeoIP protobuf: %w", err))
          	}
          	if err := writeCategories(categoryPath, len(privatePrefixes), len(ruPrefixes)); err != nil {
          		panic(err)
          	}
          	if err := writeSourceCounts(countsPath, counts); err != nil {
          		panic(err)
          	}
          
          	manifest := []string{
          		"GeoIP Russia CLIENT v30 — trusted GeoIP layers, corroborated additional sources, RIR/ASN/BGP quality audit",
          		"Trusted geographic RU layers: full public address coverage from Loyalsoldier geoip:ru and v2fly geoip.dat ru, subject only to the higher-priority PRIVATE policy.",
          		"v24 is not fetched, protected, or used as a regression baseline.",
          		"Additional RU GeoIP feeds: Grimbird, Digne, Davoyan, Golukon.",
          			"Hydra roscomvpn-geoip currently publishes direct/whitelist/private, not strict geoip:ru; its direct/whitelist CIDRs are diagnostic candidates only, not an additional RU GeoIP feed.",
          		"Additional-feed admission: overlap of two distinct named GeoIP feeds OR overlap with RU-origin BGP OR overlap with an RIR-RU registered address resource. Distinct feeds are not guaranteed statistically independent.",
          		"RU ASN-origin BGP prefixes are included as an additive AS-registration/routing layer; RU registration does not prove physical server location.",
          		"RIR-RU IPv4/IPv6 resources are corroboration only; registration country does not prove physical server location.",
          		"Hydra direct/whitelist and other candidate lists are diagnostic only and never subtract from RU. Candidate-only ranges are not independently admitted.",
          		"PRIVATE priority: built-in local/reserved ranges + IANA Globally-Reachable=False entries + Loyalsoldier private.dat. IANA Globally-Reachable=True exceptions carve out broad special-purpose blocks.",
          		"Global BGP observation comes from ipverse/as-ip-blocks aggregated.json dataset; it covers ASes observed announcing within the preceding 90 days, not a real-time global RIB.",
          		"A prefix not observed in the ipverse aggregate must not be called globally unroutable solely on that basis.",
          		"Only existing GeoIP categories RU and PRIVATE are emitted; both IPv4 and IPv6 are supported.",
          		"Attribution: v2fly/geoip is licensed CC-BY-SA-4.0; upstream README also identifies DB-IP data under CC-BY-4.0. Preserve applicable notices.",
          	}
          	if err := os.WriteFile(sourcePath, []byte(strings.Join(manifest, "\n")+"\n"), 0644); err != nil {
          		panic(err)
          	}
          
          	quality := []string{
          		"=== FINAL OUTPUT ===",
          		statsLine("RU", finalRU),
          		statsLine("PRIVATE", privateTrie),
          		fmt.Sprintf("Final IPv4 address count: %s", ipv4Count),
          		fmt.Sprintf("Final IPv6 address count: %s", ipv6Count),
          		fmt.Sprintf("Final protobuf bytes: %d", len(data)),
          		"",
          		"=== TRUSTED GEOIP LAYERS ===",
          		statsLine("Loyalsoldier geoip:ru", protectedLoyalsoldierRU),
          		statsLine("v2fly geoip.dat ru", protectedV2FlyRU),
          		statsLine("Trusted union after PRIVATE", trustedPublic),
          		"",
          		"=== ADDITIONAL GEOGRAPHIC FEEDS ===",
          		statsLine("All additional GeoIP feed union", additionalUnion),
          		statsLine("Accepted with 2+ distinct feeds", additionalTwoSources),
          		statsLine("Additional feed overlap RU-origin BGP", additionalWithRUBGP),
          		statsLine("Additional feed overlap RIR-RU resources", additionalWithRIRRU),
          		statsLine("Accepted additional union (post-trust dedupe)", eligibleAdditional),
          		statsLine("Unconfirmed additional feed space not included", unconfirmedAdditional),
          		"",
          		"=== ASN / RIR / GLOBAL ROUTING EVIDENCE ===",
          		statsLine("RU-registered ASN BGP prefixes", asnRU),
          		statsLine("RIR-RU registered address resources", rirRU),
          		statsLine("All-AS ipverse global BGP observation union", globalBGP),
          		statsLine("Final RU covered by RU-origin ASN BGP", finalInRUASN),
          		statsLine("New final address space from RU-origin BGP layer", newBGP),
          		statsLine("Final RU covered by RIR-RU resource registration", finalInRIR),
          		statsLine("Final RU observed in global ipverse aggregate", observedGlobal),
          		statsLine("Final RU not observed in global ipverse aggregate", notObservedGlobal),
          		"",
          		"=== DIRECT / WHITELIST SIGNALS (NO CARVE-OUT) ===",
          		statsLine("Direct/whitelist candidate union", candidates),
          		statsLine("Candidates overlapping RU-origin BGP", candidateOnRUBGP),
          		statsLine("Candidates overlapping RIR-RU allocations", candidateOnRIR),
          		statsLine("Candidates overlapping trusted GeoIP layers", candidateOnTrusted),
          		"",
          		"=== BUILD COUNTERS ===",
          		fmt.Sprintf("Geographic RU source CIDR inputs (trusted + additional): %d", coreRaw),
          		fmt.Sprintf("Direct/whitelist candidate CIDR inputs: %d", candidateRaw),
          		fmt.Sprintf("RU ASN/BGP CIDR inputs: %d", bgpRaw),
          		fmt.Sprintf("RIR-RU CIDR inputs: %d", rirRaw),
          		fmt.Sprintf("Global ipverse BGP CIDR inputs: %d", globalRaw),
          		fmt.Sprintf("IANA non-global CIDR inputs: %d", counts["iana-non-global"]),
          		fmt.Sprintf("IANA globally-reachable exceptions: %d", counts["iana-global-exceptions"]),
          		"",
          		"=== INTERPRETATION LIMITS ===",
          		"- RIR country is resource registration country, not physical geolocation.",
          		"- RU ASN origin is an AS-registration/routing signal, not proof all originated addresses are hosted in Russia.",
          		"- ipverse global coverage is a 90-day observed-AS aggregate, not a real-time global BGP RIB.",
          		"- CIDR counts are not address counts; IPv4/IPv6 address coverage above is calculated exactly from disjoint prefixes.",
          		"- Two named GeoIP sources may share upstream datasets; source agreement is not guaranteed statistical independence.",
          	}
          	if err := writeQualityReport(qualityPath, quality); err != nil {
          		panic(err)
          	}
          
          	fmt.Println("============================================================")
          	fmt.Println("GEOIP RUSSIA CLIENT v30 — QUALITY EDITION")
          	fmt.Println("============================================================")
          	fmt.Println(statsLine("Final RU", finalRU))
          	fmt.Println(statsLine("Final PRIVATE", privateTrie))
          	fmt.Println(statsLine("Loyalsoldier RU", protectedLoyalsoldierRU))
          	fmt.Println(statsLine("v2fly RU", protectedV2FlyRU))
          	fmt.Println(statsLine("Additional accepted", eligibleAdditional))
          	fmt.Println(statsLine("Not observed in global ipverse aggregate", notObservedGlobal))
          	fmt.Printf("Final protobuf bytes: %d\n", len(data))
          	fmt.Printf("GeoIP RU source CIDR inputs: %d; candidate inputs: %d; RU ASN/BGP inputs: %d; RIR-RU inputs: %d; global BGP prefixes: %d\n", coreRaw, candidateRaw, bgpRaw, rirRaw, globalRaw)
          	fmt.Println("Loyalsoldier public coverage preservation: PASSED (subject to PRIVATE)")
          	fmt.Println("v2fly public coverage preservation: PASSED (subject to PRIVATE)")
          	fmt.Println("PRIVATE/RU disjointness invariant: PASSED")
          	fmt.Println("Direct/whitelist carve-out: DISABLED")
          }
          GO

          gofmt -w geoip-builder/main.go
          cd geoip-builder
          GOTOOLCHAIN=local go mod init geoip-builder
          GOTOOLCHAIN=local go get github.com/v2fly/v2ray-core/v5/app/router/routercommon@v5.56.0
          GOTOOLCHAIN=local go get google.golang.org/protobuf@v1.36.12
          GOTOOLCHAIN=local go mod tidy
          GOTOOLCHAIN=local go build -o /tmp/geoip-russia-v30-builder .
          cd ..

          /tmp/geoip-russia-v30-builder \
            "$HYDRA_INPUT" \
            "$GRIMBIRD_INPUT" \
            "$DIGNE_INPUT" \
            "$DAVOYAN_INPUT" \
            "$KIRILL_INPUT" \
            "$GOLUKON_INPUT" \
            "$V2FLY_INPUT" \
            "$LOYALSOLDIER_RU_INPUT" \
            "$LOYALSOLDIER_PRIVATE_INPUT" \
            "$HXEHEX_INPUT" \
            "$W1ZARDZ_INPUT" \
            "$RU_PREFIX_INPUT" \
            "$RIR_PREFIX_INPUT" \
            "$GLOBAL_BGP_PREFIX_INPUT" \
            "$IANA_PRIVATE_PREFIX_INPUT" \
            "$IANA_REACHABLE_PREFIX_INPUT" \
            "$OUTPUT_FILE" \
            "$CATEGORY_FILE" \
            "$SOURCE_FILE" \
            "$SOURCE_COUNTS" \
            "$QUALITY_REPORT"

          for file in "$OUTPUT_FILE" "$CATEGORY_FILE" "$SOURCE_FILE" "$SOURCE_COUNTS" "$QUALITY_REPORT"; do
            test -s "$file" || { echo "::error::Missing or empty build artifact: $file"; exit 1; }
          done

      - name: Validate v30 output and quality report
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUTPUT_FILE" "$ASN_MANIFEST" "$ASN_STATS" "$RIR_STATS" "$SOURCE_COUNTS" "$QUALITY_REPORT" <<'PY'
          import os, sys
          output, manifest, bgp_stats, rir_stats, counts, quality = sys.argv[1:]
          for path, minimum in ((output, 4), (manifest, 100), (bgp_stats, 100), (rir_stats, 100), (counts, 50), (quality, 500)):
              if not os.path.isfile(path) or os.path.getsize(path) < minimum:
                  raise SystemExit(f"Missing or unexpectedly small v30 artifact: {path}")
          with open(counts, encoding="utf-8") as source:
              rows = [line.rstrip("\n").split("\t") for line in source if line.strip()]
          count_map = {row[0]: int(row[1]) for row in rows[1:] if len(row) == 2}
          required_ru = ("grimbird", "digne", "davoyan", "golukon", "loyalsoldier", "v2fly")
          required_other = ("hydra", "loyalsoldier-private", "ru-asn-bgp", "rir-ru", "global-bgp", "iana-non-global", "iana-global-exceptions")
          missing_ru = [name for name in required_ru if count_map.get(name, 0) <= 0]
          missing_other = [name for name in required_other if count_map.get(name, 0) <= 0]
          if missing_ru or missing_other:
              raise SystemExit("Required v30 inputs missing/empty: RU feeds=" + ", ".join(missing_ru) + "; other inputs=" + ", ".join(missing_other))
          print(f"Validated GeoIP protobuf payload: {os.path.getsize(output)} bytes")
          print("Trusted layers: Loyalsoldier RU and v2fly RU.")
          print("Hydra direct/whitelist is validated as candidate signal input, not as a strict RU GeoIP feed.")
          print("No v24 baseline is downloaded or used.")
          print("PRIVATE has precedence; direct/whitelist candidates are not subtracted.")
          print("RIR-RU and global ipverse BGP audit artifacts are present.")
          PY

          echo "=== RIR registered RU address resources ==="
          cat "$RIR_STATS"
          echo "=== ASN and BGP statistics ==="
          cat "$ASN_STATS"
          echo "=== Source contribution counts ==="
          cat "$SOURCE_COUNTS"
          echo "=== GeoIP categories ==="
          cat "$CATEGORY_FILE"
          echo "=== Source manifest ==="
          cat "$SOURCE_FILE"
          echo "=== Quality report ==="
          cat "$QUALITY_REPORT"
          echo "=== SHA256 ==="
          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-geoip-client-v30
          name: "GeoIP Russia CLIENT v30 (Hydra source classification fix + Quality Edition)"
          make_latest: false
          files: |
            geoip_RU.dat
            geoip_RU.dat.sha256sum
            geoip_RU_categories.txt
            geoip_RU_sources.txt
            geoip_RU_source_counts.txt
            geoip_RU_quality_report.txt
            geoip_RU_asn_manifest.txt
            geoip_RU_asn_stats.txt
            geoip_RU_asn_bgp_prefixes.txt
            geoip_RU_registered_asns.txt
            geoip_RU_rir_registered_prefixes.txt
            geoip_RU_rir_stats.txt
            geoip_RU_global_bgp_prefixes.txt
          body: |
            # GeoIP Russia CLIENT v30 — Quality Edition

            ## Trusted geographic RU layers
            - Loyalsoldier `geoip:ru`
            - v2fly `geoip.dat` `ru` category
            - Both trusted layers are retained in full except where the higher-priority PRIVATE policy applies.
            - v24 is not downloaded or used as a baseline.

            ## Additional geographic sources
            - Grimbird, Digne, Davoyan and Golukon are additional RU GeoIP feeds.
            - Hydra `direct` and `whitelist` are diagnostic candidates only; its upstream project does not publish a strict `ru` category and these sets include RU/BY, CDN and foreign infrastructure.
            - Additional-feed address space is admitted when it is covered by at least two distinct named GeoIP feeds, or corroborated by RU-origin BGP, or by an RIR-RU registered address resource.
            - Separate named feeds may share upstream datasets; this is agreement, not a guarantee of statistical independence.

            ## ASN, RIR and routing audit
            - RU-registered ASN prefixes from five RIR registries are added.
            - RIR-registered RU IPv4/IPv6 resources are used as corroboration, not as proof of physical hosting location.
            - Global route observation is derived from the ipverse aggregated dataset. Its AS dataset covers announcements observed within the preceding 90 days, not a real-time global RIB.
            - Prefixes absent from that aggregate are labelled not observed, not globally unroutable.

            ## Direct/whitelist
            - Direct/whitelist inputs are diagnostic signals only.
            - They never subtract address space from RU.
            - Candidate-only ranges are not independently admitted.

            ## PRIVATE
            - PRIVATE has absolute precedence over all RU layers.
            - Sources: built-in local/reserved entries, IANA Special-Purpose `Globally Reachable=False`, and Loyalsoldier `private.dat`.
            - IANA `Globally Reachable=True` exceptions are carved out from broad special-purpose blocks.

            ## Output
            - Only `geoip:RU` and `geoip:PRIVATE` are emitted.
            - IPv4 and IPv6 exact address coverage are reported in `geoip_RU_quality_report.txt`.

            ## Attribution
            - v2fly/geoip is licensed CC-BY-SA-4.0; upstream README also identifies DB-IP data under CC-BY-4.0. Preserve applicable upstream notices.

      - name: Publish release branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/geoip-client-release
          mkdir -p /tmp/geoip-client-release
          for file in \
            "$OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$CATEGORY_FILE" "$SOURCE_FILE" \
            "$SOURCE_COUNTS" "$QUALITY_REPORT" "$ASN_MANIFEST" "$ASN_STATS" \
            "$RU_PREFIX_INPUT" "$RU_ASN_REGISTRY" "$RIR_PREFIX_INPUT" "$RIR_STATS" "$GLOBAL_BGP_PREFIX_INPUT"; do
            cp "$file" /tmp/geoip-client-release/"$(basename "$file")"
          done
          cd /tmp/geoip-client-release
          git init
          git checkout -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Publish GeoIP Russia CLIENT v30 quality build"
          git remote add origin "https://github.com/${{ github.repository }}.git"
          AUTH_B64="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}" \
          GIT_TERMINAL_PROMPT=0 git push --force origin release

          purge_jsdelivr() {
            local path="$1"
            local response
            response="$(curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 90 \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${path}")"
            printf '%s\n' "$response"
            python3 -c 'import json,sys; d=json.loads(sys.argv[1]); p=next(iter(d.get("paths",{}).values()),{}); providers=p.get("providers",{}); ok=(d.get("status")=="finished" and p.get("throttled") is False and providers and all(v is True for v in providers.values())); print("Purge status:",d.get("status"),"providers:",providers); sys.exit(0 if ok else 1)' "$response"
          }
          purge_jsdelivr "geoip_RU.dat"
          purge_jsdelivr "geoip_RU.dat.sha256sum"
          purge_jsdelivr "geoip_RU_quality_report.txt"

      - name: Print download and audit URLs
        shell: bash
        run: |
          echo "GitHub Release: https://${{ github.server_url }}/${{ github.repository }}/releases/download/latest-geoip-client-v30/geoip_RU.dat"
          echo "Raw release branch: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU.dat"
          echo "jsDelivr: https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geoip_RU.dat"
          echo "Quality report: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_quality_report.txt"
          echo "Source contribution report: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_source_counts.txt"
          echo "ASN manifest: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_asn_manifest.txt"
          echo "RIR RU resources: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_rir_registered_prefixes.txt"
          echo "Global BGP observation set: https://raw.githubusercontent.com/${{ github.repository }}/release/geoip_RU_global_bgp_prefixes.txt"
